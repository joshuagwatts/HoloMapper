name: Build Windows app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.0.0)"
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: holomapper-app/package-lock.json

      - name: Pin current holomapper.html into the app
        shell: bash
        run: |
          cp holomapper.html holomapper-app/app/index.html
          ls -la holomapper-app/app/

      - name: Install dependencies
        working-directory: holomapper-app
        run: npm ci

      - name: Build portable exe
        working-directory: holomapper-app
        run: npx electron-builder --win portable --publish never

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: holomapper-app/dist/HoloMapper-*-portable.exe
          fail_on_unmatched_files: true
