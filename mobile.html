<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>HoloMapper Mobile</title>
<style>
/* ============ HoloMapper Mobile v6 — desktop paradigm, phone fit ============
   The desktop instrument (deck, columns, transport, inspector, macros) with
   phone ergonomics: big touch targets, horizontal strip scrolling, bottom
   sheets. Desktop's semantic-color language: teal = live, amber = queued /
   armed, red = destructive. */
:root{
  color-scheme:dark;
  --bg:#0b0d12; --panel:#14161c; --panel2:#1a1d24;
  --line:#23262e; --line2:#2e323c;
  --txt:#e8eaee; --dim:#878b94;
  --teal:#2dd4bf; --amber:#fbbf24; --red:#f87171;
  --r:12px;
  --sat:env(safe-area-inset-bottom,0px);
  --satT:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  user-select:none;-webkit-user-select:none;
  text-size-adjust:100%;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit}
/* ---------- stage ---------- */
#stage{position:relative;flex:none;height:24dvh;min-height:170px;background:#000;border-bottom:1px solid var(--line)}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;top:calc(6px + var(--satT));left:10px;right:10px;display:flex;align-items:center;gap:8px;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
.brand{font-weight:900;font-size:15px;letter-spacing:.4px;color:var(--txt)}
.brand em{font-style:normal;color:var(--teal)}
.vtag{font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line2);border-radius:20px;padding:2px 8px}
.sp{flex:1}
#fps{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.icobtn{min-width:44px;min-height:44px;border-radius:12px;background:rgba(20,22,28,.85);
  border:1px solid var(--line2);color:var(--txt);font-size:17px;touch-action:manipulation}
/* ---------- transport ---------- */
#transport{flex:none;display:flex;gap:4px;align-items:center;overflow-x:auto;
  padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);
  -webkit-overflow-scrolling:touch;scrollbar-width:none}
#transport::-webkit-scrollbar{display:none}
.tbtn2{flex:none;min-width:52px;min-height:48px;padding:8px 10px;border-radius:10px;
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt);
  font-weight:800;font-size:12px;touch-action:manipulation;white-space:nowrap}
.tbtn2:active{background:#242832}
.tbtn2.on{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.tbtn2.armed{background:rgba(248,113,113,.16);border-color:var(--red);color:var(--red)}
/* TAP + BPM read as one joined unit */
#btnTap{border-radius:10px 3px 3px 10px}
#bpmBig{flex:none;display:inline-flex;align-items:center;min-height:48px;min-width:52px;
  font-size:20px;font-weight:900;color:var(--txt);text-align:center;padding:0 6px 0 10px;
  background:var(--panel2);border:1px solid var(--line2);border-left:none;margin-left:-5px;
  border-radius:3px 3px 3px 3px;font-variant-numeric:tabular-nums}
.bpmlab{flex:none;align-self:stretch;display:inline-flex;align-items:center;min-height:48px;
  font-size:10px;color:var(--dim);font-weight:700;background:var(--panel2);
  border:1px solid var(--line2);border-left:none;margin-left:-1px;border-radius:3px 10px 10px 3px;
  padding:0 10px 0 2px}
/* ---------- column bar ---------- */
#colbar{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 10px}
#colbtns{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#colbtns::-webkit-scrollbar{display:none}
.collab{flex:none;font-size:10px;font-weight:800;color:var(--dim);letter-spacing:.08em;align-self:center}
.colbtn{flex:none;min-width:52px;min-height:44px;border-radius:10px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--dim);font-weight:800;font-size:13px;touch-action:manipulation}
.colbtn.conn{background:rgba(45,212,191,.2);border-color:var(--teal);color:var(--teal);
  box-shadow:0 0 12px rgba(45,212,191,.35)}
.colbtn.queued{background:rgba(251,191,36,.16);border-color:var(--amber);color:var(--amber);
  animation:qpulse 1s infinite}
@keyframes qpulse{50%{box-shadow:0 0 14px rgba(251,191,36,.5)}}
/* ---------- deck ---------- */
#deckWrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:8px 0 calc(8px + var(--sat));touch-action:pan-y}
.lstrip{margin:0 10px 10px;border:1px solid var(--line);border-radius:var(--r);display:flex;
  border-left:4px solid hsl(var(--lhue,200) 85% 60%);background:var(--panel);overflow:hidden}
/* Resolume-style V fader + mix mode on the strip's left edge */
.lfad{flex:none;width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px 6px;border-right:1px solid var(--line)}
/* Chunky Resolume-style V fader — custom pointer-drag component (ported from
   desktop). Wide track, big grabbable handle, full strip height. touch-action:
   pan-x so vertical drags own the gesture instead of scrolling the deck. */
.vfad{position:relative;flex:1;min-height:104px;width:44px;cursor:ns-resize;touch-action:pan-x;
  outline:none;border-radius:6px;flex:none}
.vfad:focus-visible{box-shadow:0 0 0 2px hsl(var(--lhue,200) 85% 60%)}
.vfad-track{position:absolute;left:50%;top:2px;bottom:2px;width:16px;transform:translateX(-50%);
  background:#07080b;border:1px solid #1b1e25;border-radius:8px;pointer-events:none;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.85)}
.vfad-fill{position:absolute;left:50%;bottom:2px;width:16px;transform:translateX(-50%);
  background:linear-gradient(to top,#0f766e,var(--teal,#2dd4bf));border-radius:8px;pointer-events:none;
  box-shadow:0 0 10px rgba(45,212,191,.4)}
.vfad-handle{position:absolute;left:50%;transform:translate(-50%,50%);width:44px;height:56px;
  background:linear-gradient(#22262d,#121418);border:1px solid #434a55;border-radius:10px;
  box-shadow:0 3px 10px rgba(0,0,0,.75),0 0 12px rgba(45,212,191,.28),inset 0 1px 0 rgba(255,255,255,.14);pointer-events:none}
.vfad-handle::before{content:'';position:absolute;left:9px;right:9px;top:50%;height:2px;
  transform:translateY(-50%);background:var(--play,#2dd4bf);border-radius:1px;
  box-shadow:0 -9px 0 0 #aeb4bf,0 9px 0 0 #aeb4bf}
.vfad-handle::after{content:none}
.vfad:active .vfad-handle{border-color:var(--play,#2dd4bf)}
.fval{font-size:11px;font-weight:800;color:var(--txt);line-height:1;font-variant-numeric:tabular-nums}
.lfad .lbsel{appearance:none;-webkit-appearance:none;max-width:52px;min-height:44px;font-size:9px;font-weight:700;
  color:var(--txt);background-color:#14161c;border:1px solid var(--line2);border-radius:8px;
  padding:2px 14px 2px 5px;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='8' height='5' viewBox='0 0 8 5'><path d='M1 1l3 3 3-3' fill='none' stroke='%23878b94' stroke-width='1.6' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 5px center}
.lbody{flex:1;min-width:0;display:flex;flex-direction:column}
.lstrip.sel{border-color:hsl(var(--lhue,200) 85% 60%)}
.lhead{display:flex;align-items:center;gap:8px;padding:10px 10px 6px}
.ltab{flex:none;min-width:48px;min-height:44px;border-radius:10px;font-weight:900;font-size:15px;
  background:hsl(var(--lhue,200) 60% 22%);border:1px solid hsl(var(--lhue,200) 70% 45%);
  color:#fff;touch-action:manipulation}
.lsrc{flex:1;font-size:12px;color:var(--dim);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn{flex:none;min-width:44px;min-height:44px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--dim);font-weight:800;touch-action:manipulation}
.tbtn.onB{background:rgba(251,191,36,.18);border-color:var(--amber);color:var(--amber)}
.tbtn.onS{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.tbtn.bClr{color:var(--dim)}
.cstrip{display:flex;gap:8px;overflow-x:auto;padding:4px 10px 10px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x pan-y}
.cstrip::-webkit-scrollbar{display:none}
.clip{flex:none;width:84px;border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:var(--panel2)}
/* Clip states — one coherent scheme: FIRED glows in the layer's own hue (ties the
   clip to its strip edge); SELECTED (not fired) gets the teal outline. Amber is
   reserved for warning/armed states (bypass), never for selection. */
.clip.fired{border-color:hsl(var(--lhue,200) 85% 62%);
  box-shadow:0 0 14px hsl(var(--lhue,200) 85% 55% / .5),inset 0 0 0 1px hsl(var(--lhue,200) 85% 62%)}
.clip.selc:not(.fired){outline:2px solid var(--teal);outline-offset:-2px}
.cbox{display:block;width:100%;min-height:58px;background:#101218;border:none;border-bottom:1px solid var(--line);
  color:var(--txt);font-weight:800;font-size:12px;touch-action:manipulation;padding:6px 4px}
.clip.fired .cbox{background:hsl(var(--lhue,200) 70% 32% / .4);color:#fff}
.clip.empty .cbox{color:var(--dim);border-bottom-style:dashed}
.cname{display:block;width:100%;min-height:38px;background:none;border:none;color:var(--dim);
  font-size:10px;font-weight:700;touch-action:manipulation;padding:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clip.selc:not(.fired) .cname{color:var(--teal)}
.clip.fired .cname{color:hsl(var(--lhue,200) 85% 72%)}
/* ---------- dock ---------- */
#dock{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + var(--sat));z-index:20}
#dock button{flex:1;min-height:58px;border:none;background:none;color:var(--dim);
  font-size:10px;font-weight:800;letter-spacing:.04em;border-radius:10px;touch-action:manipulation}
#dock button i{display:block;font-style:normal;font-size:19px;margin-bottom:2px}
#dock button.on{color:var(--teal);background:rgba(45,212,191,.12);
  box-shadow:0 0 14px rgba(45,212,191,.22),inset 0 2px 0 var(--teal)}
/* ---------- bottom sheet ---------- */
#sheetBack{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:44;opacity:0;pointer-events:none;transition:opacity .22s}
#sheetBack.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:45;max-height:74dvh;display:flex;flex-direction:column;
  background:var(--panel);border-top:1px solid var(--line2);border-radius:18px 18px 0 0;
  transform:translateY(103%);transition:transform .25s ease;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
#sheet.open{transform:translateY(0)}
#sheetGrab{flex:none;padding:10px;display:flex;align-items:center;gap:10px;touch-action:manipulation;cursor:pointer}
#sheetGrab::before{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:44px;height:4px;border-radius:2px;background:var(--line2)}
#sheetTitle{font-weight:900;font-size:14px;letter-spacing:.06em;color:var(--txt);margin-left:4px}
#sheetX{margin-left:auto;min-width:40px;min-height:40px;border-radius:10px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--dim);font-size:16px}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:4px 14px calc(20px + var(--sat));touch-action:pan-y}
/* ---------- inspector ---------- */
.inspHead{display:flex;align-items:center;gap:8px;margin:6px 0 10px}
.inspId{font-weight:900;font-size:15px;letter-spacing:.03em}
.badge{font-size:10px;font-weight:900;letter-spacing:.06em;padding:3px 9px;border-radius:20px}
.badge.live{background:rgba(45,212,191,.18);color:var(--teal);border:1px solid var(--teal)}
.badge.queue{background:rgba(251,191,36,.16);color:var(--amber);border:1px solid var(--amber);animation:qpulse 1s infinite}
.pvwrap{border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#000;margin-bottom:12px}
.pvwrap canvas{width:100%;height:auto;display:block;aspect-ratio:16/9}
.secttl{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--dim);margin:14px 0 8px;text-transform:uppercase}
.srcchips{display:flex;flex-wrap:wrap;gap:8px}
.srcchip{flex:1 1 28%;min-height:52px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--txt);font-weight:800;font-size:13px;touch-action:manipulation}
.srcchip.on{background:rgba(45,212,191,.16);border-color:var(--teal);color:var(--teal)}
.inspParams{margin-top:4px}
.prow{margin:10px 0}
.pline{display:flex;align-items:center;gap:10px}
.pline label{flex:none;width:76px;font-size:12px;color:var(--dim);font-weight:700}
.pline input[type=range]{flex:1;min-height:44px;touch-action:pan-y}
.pval{flex:none;min-width:52px;text-align:right;font-size:12px;color:var(--teal);font-variant-numeric:tabular-nums}
.psub{display:flex;align-items:center;gap:8px;margin-top:2px;padding-left:86px}
.mlab{font-size:10px;color:var(--dim)}
.msel{flex:none;min-height:36px;background:var(--panel2);border:1px solid var(--line2);color:var(--txt);border-radius:8px;font-size:12px}
.mdep{flex:1;min-height:36px}
.inspAct{display:flex;gap:10px;margin:16px 0 6px}
.abtn{flex:1;min-height:56px;border-radius:14px;font-weight:900;font-size:15px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--txt);touch-action:manipulation}
.abtn.primary{background:rgba(45,212,191,.16);border-color:var(--teal);color:var(--teal)}
.abtn.danger{color:var(--red);border-color:rgba(248,113,113,.4)}
.segrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.seglab{flex:1;font-size:13px;font-weight:700}
.segbtn{flex:1;min-height:52px;border-radius:12px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--txt);font-weight:800;touch-action:manipulation}
.segbtn.on{background:rgba(45,212,191,.16);border-color:var(--teal);color:var(--teal)}
.segrow input[type=checkbox]{width:28px;height:28px;accent-color:var(--teal)}
.hint{font-size:12px;color:var(--dim);margin:8px 0}
/* ---------- FX browser ---------- */
.fxgroup{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--teal);margin:16px 0 8px;text-transform:uppercase}
.fxcard{background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:12px;margin-bottom:10px}
.fxcard.offx{opacity:.55}
.fxchead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.fxname{flex:1;font-weight:900;font-size:15px}
.fxname .sub{display:block;font-size:11px;color:var(--dim);font-weight:600}
.fxswitch{flex:none;width:62px;height:38px;border-radius:20px;background:#2a2e38;border:1px solid var(--line2);
  position:relative;touch-action:manipulation}
.fxswitch::after{content:"";position:absolute;top:3px;left:4px;width:28px;height:28px;border-radius:50%;background:#6b7280;transition:left .15s}
.fxswitch.on{background:rgba(45,212,191,.25);border-color:var(--teal)}
.fxswitch.on::after{left:26px;background:var(--teal)}
.srow{margin:8px 0}
.slab{display:flex;align-items:center;margin-bottom:2px}
.slab label{flex:1;font-size:13px;font-weight:700}
.sval{font-size:12px;color:var(--teal);font-variant-numeric:tabular-nums}
.srow input[type=range]{width:100%;min-height:48px;touch-action:pan-y}
/* ---------- mix / setup ---------- */
.mixrow{background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.mixhead{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.mixname{flex:1;font-weight:900;font-size:14px}
.minibtn{flex:none;min-width:44px;min-height:44px;border-radius:10px;background:var(--panel);
  border:1px solid var(--line2);color:var(--dim);font-weight:900;touch-action:manipulation}
.minibtn.onS{background:rgba(45,212,191,.18);border-color:var(--teal);color:var(--teal)}
.minibtn.onB{background:rgba(251,191,36,.18);border-color:var(--amber);color:var(--amber)}
.prowcard{background:var(--panel2);border:1px solid var(--line2);border-radius:14px;padding:12px;margin-bottom:10px}
.btnrow{display:flex;gap:8px;margin:8px 0}
.gbtn{flex:1;min-height:52px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);
  color:var(--txt);font-weight:800;font-size:13px;touch-action:manipulation}
.txtin,.dsel{width:100%;min-height:52px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);
  color:var(--txt);font-size:14px;padding:0 12px;margin:4px 0}
.trow{display:flex;align-items:center;gap:8px;margin:8px 0}
.meter{flex:1;height:10px;background:#101218;border-radius:6px;overflow:hidden}
.meter i{display:block;height:100%;width:0%;background:var(--teal)}
.dim{font-size:12px;color:var(--dim)}
.dbtn{width:100%;min-height:56px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--dim);font-weight:800;font-size:14px;touch-action:manipulation}
.dbtn.armed{background:rgba(248,113,113,.16);border-color:var(--red);color:var(--red);animation:qpulse 1s infinite}
/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:calc(96px + var(--sat));transform:translateX(-50%) translateY(20px);
  background:#1e2129;border:1px solid var(--line2);color:var(--txt);border-radius:12px;
  padding:12px 18px;font-size:13px;font-weight:700;max-width:92vw;text-align:center;z-index:90;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- map overlay (engine) ---------- */
#mapWrap{position:absolute;inset:0;z-index:30;display:none;pointer-events:none}
#mapWrap.on{display:block}
#mapcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto;touch-action:none}
#mhandle{position:absolute;pointer-events:none}
#handles{position:absolute;inset:0;z-index:31;display:none;pointer-events:none}
#handles.on{display:block}
body.output.pins #handles{display:block!important}
.chandle{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
  background:rgba(45,212,191,.18);border:3px dashed var(--teal);pointer-events:auto;touch-action:none;
  color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;
  font-size:18px;text-shadow:0 1px 3px #000}
.chandle.sel{background:rgba(45,212,191,.45);border-color:var(--teal)}
.surfrow{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:8px;
  background:var(--panel2);border:1px solid var(--line2);border-radius:12px}
.sname{flex:1;font-weight:800}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;min-height:48px;border-radius:14px;font-weight:800;
  background:var(--panel2);border:1px solid var(--line2);color:var(--txt);touch-action:manipulation}
.seg button.on{background:rgba(45,212,191,.16);border-color:var(--teal);color:var(--teal)}
.nudge{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin:8px 0}
.nudge button{min-height:52px;border-radius:12px;font-size:18px;background:var(--panel2);
  border:1px solid var(--line2);color:var(--txt);touch-action:manipulation}
details.cgrp{margin:8px 0;background:var(--panel2);border:1px solid var(--line2);border-radius:12px}
details.cgrp>summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--teal);padding:10px 12px;list-style:none}
details.cgrp>summary::-webkit-details-marker{display:none}
/* ---------- output mode / misc ---------- */
#panelFab{position:fixed;bottom:calc(96px + var(--sat));right:14px;z-index:40;display:none;
  min-height:52px;padding:12px 20px;border-radius:26px;font-weight:800;
  background:rgba(45,212,191,.2);border:1px solid var(--teal);color:var(--teal);
  box-shadow:0 8px 24px rgba(0,0,0,.5);touch-action:manipulation}
#btnExitOut{position:fixed;top:calc(12px + var(--satT));right:12px;z-index:60;display:none;
  width:52px;height:52px;border-radius:50%;font-size:20px;
  background:rgba(10,12,21,.9);border:1px solid var(--line2);color:var(--txt)}
#btnOutPins{position:fixed;top:calc(12px + var(--satT));right:76px;z-index:60;display:none;
  width:52px;height:52px;border-radius:50%;font-size:20px;

<script>
'use strict';
/* =====================================================================
   HoloMapper v1 — a self-contained WebGL2 live visual performance deck.
   Zero network dependencies. One canvas, 4 layer FBOs -> combine ->
   feedback (ping-pong) -> kaleido -> glitch -> grade -> screen.
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp = (a,b,t) => a+(b-a)*t;
function debounce(fn,ms){ let t=0; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function showErr(msg){
  const b = $('errbanner');
  b.textContent = 'HoloMapper: ' + msg;
  b.classList.add('show');
  console.error('[HoloMapper]', msg);
}
/* ================= SHAPER MODULATORS — UI (v1.2) =================
   Drawable LFO curves (ShaperBox-style) driving cloner params. Depth/Rate/
   Phase/Bipolar are real params (MIDI-learnable, macro-assignable); curve
   points, smoothing, sync mode, bus, and routings live in S.mods. */
const MOD_WAVES={
  sine:[[0,.5],[.125,.854],[.25,1],[.375,.854],[.5,.5],[.625,.146],[.75,0],[.875,.146],[1,.5]],
  tri:[[0,.5],[.25,1],[.75,0],[1,.5]],
  saw:[[0,0],[.99,1]],
  sqr:[[0,1],[.495,1],[.5,0],[.995,0]],
  rnd:null
};
function setModWave(i,m,w){
  const cfg=S.mods[i][m];
  if(w==='rnd'){
    const pts=[];
    for(let k=0;k<8;k++) pts.push([k/7,Math.random()]);
    cfg.pts=pts;
  }else{
    cfg.pts=MOD_WAVES[w].map(p=>p.slice());
  }
  saveState();
}
function drawModCurve(cv,cfg){
  const ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#0b0e16';ctx.fillRect(0,0,W,H);
  /* beat-division grid */
  ctx.strokeStyle='rgba(120,140,180,0.18)';ctx.lineWidth=1;
  for(let k=0;k<=4;k++){const x=k/4*W;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  ctx.strokeStyle='rgba(120,140,180,0.28)';
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();
  /* curve */
  ctx.strokeStyle='#5eead4';ctx.lineWidth=2;ctx.beginPath();
  for(let s=0;s<=96;s++){
    const ph=s/96,v=sampleCurve(cfg.pts,ph,cfg.smooth);
    const x=ph*W,y=(1-v)*H;
    if(s===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  }
  ctx.stroke();
  /* points */
  ctx.fillStyle='#c4b5fd';
  for(const p of cfg.pts){
    ctx.beginPath();ctx.arc(p[0]*W,(1-p[1])*H,4,0,6.2832);ctx.fill();
  }
}
function wireModCanvas(cv,i,m,draw){
  const cfg=()=>S.mods[i][m];
  const pos=e=>{
    const r=cv.getBoundingClientRect();
    return [clamp((e.clientX-r.left)/r.width,0,1),clamp(1-(e.clientY-r.top)/r.height,0,1)];
  };
  let drag=-1;
  cv.addEventListener('pointerdown',e=>{
    const [x,y]=pos(e),pts=cfg().pts;
    let best=-1,bd=1e9;
    pts.forEach((p,pi)=>{const d=Math.hypot(p[0]-x,(p[1]-y)*0.45);if(d<bd){bd=d;best=pi;}});
    if(bd<0.07){drag=best;}
    else{pts.push([x,y]);pts.sort((a,b)=>a[0]-b[0]);drag=pts.findIndex(p=>p[0]===x&&p[1]===y);}
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
    draw();saveState();e.preventDefault();
  });
  cv.addEventListener('pointermove',e=>{
    if(drag<0)return;
    const [x,y]=pos(e),pts=cfg().pts;
    pts[drag]=[x,y];pts.sort((a,b)=>a[0]-b[0]);
    drag=pts.findIndex(p=>p[0]===x&&p[1]===y);
    draw();
  });
  const end=()=>{if(drag>=0){drag=-1;saveState();}};
  cv.addEventListener('pointerup',end);
  cv.addEventListener('pointercancel',end);
  cv.addEventListener('dblclick',e=>{
    const [x,y]=pos(e),pts=cfg().pts;
    if(pts.length<=2)return;
    let best=-1,bd=1e9;
    pts.forEach((p,pi)=>{const d=Math.hypot(p[0]-x,(p[1]-y)*0.45);if(d<bd){bd=d;best=pi;}});
    if(bd<0.07){pts.splice(best,1);draw();saveState();}
  });
  cv.addEventListener('contextmenu',e=>e.preventDefault());
}
/* routable cloner params for the target picker (excludes modulator params) */
function clonerParamOptions(i){
  const pre='L'+i+'.cl';
  return Object.keys(PARAMS)
    .filter(id=>id.indexOf(pre)===0 && id.indexOf('.clM')!==0)
    .map(id=>({id:id,label:PARAMS[id].label}));
}
function drawModTargets(tg,i,m,refresh){
  const cfg=S.mods[i][m],opts=clonerParamOptions(i);
  cfg.targets.forEach((tg2,ti)=>{
    const row=el('div','tgrow');
    const se=document.createElement('select');se.className='dsel';se.title='Target cloner param';
    opts.forEach(o=>se.appendChild(new Option(o.label,o.id)));
    se.value=PARAMS[tg2.id]?tg2.id:opts[0].id;
    se.addEventListener('change',()=>{tg2.id=se.value;saveState();});
    row.appendChild(se);
    const dp=document.createElement('input');
    dp.type='range';dp.min=0;dp.max=1;dp.step=0.01;dp.value=tg2.depth;dp.title='Routing depth';
    dp.addEventListener('input',()=>{tg2.depth=parseFloat(dp.value);});
    dp.addEventListener('change',()=>saveState());
    row.appendChild(dp);
    const x=el('button','tgx','\u00D7');x.title='Remove routing';
    x.addEventListener('click',()=>{cfg.targets.splice(ti,1);saveState();refresh();});
    row.appendChild(x);
    tg.appendChild(row);
  });
}
function buildModulatorsUI(parent,i){
  const gM=cgrp(parent,'Modulators A\u2013F',false);
  gM.appendChild(mkHint('Drawable LFOs. Raise a Depth to activate. Double-click a point to delete.'));
  for(let m=0;m<6;m++){
    const L=MOD_LETTERS[m],cfg=S.mods[i][m],pre='L'+i+'.clM'+L+'_';
    const det=el('details','cgrp'),sum=el('summary');
    sum.textContent='Mod '+L;det.appendChild(sum);
    const b=el('div','csub');det.appendChild(b);gM.appendChild(det);
    const cv=document.createElement('canvas');
    cv.width=248;cv.height=104;cv.className='modcv';
    cv.title='Click: add point \u00B7 drag: move \u00B7 double-click: delete';
    b.appendChild(cv);
    const draw=()=>drawModCurve(cv,cfg);
    draw();
    wireModCanvas(cv,i,m,draw);
    const pr=el('div','modrow');
    ['sine','tri','saw','sqr','rnd'].forEach(w=>{
      const btn=el('button','mbtn',w);btn.title='Load '+w+' wave';
      btn.addEventListener('click',()=>{setModWave(i,m,w);draw();});
      pr.appendChild(btn);
    });
    const slb=el('label');slb.style.cssText='font-size:11px;color:var(--dim)';
    const sm=document.createElement('input');
    sm.type='checkbox';sm.checked=cfg.smooth;sm.title='Smooth curve interpolation';
    sm.addEventListener('change',()=>{cfg.smooth=sm.checked;draw();saveState();});
    slb.appendChild(sm);slb.appendChild(document.createTextNode(' smooth'));
    pr.appendChild(slb);b.appendChild(pr);
    const sy=el('div','modrow');
    const ssel=document.createElement('select');ssel.className='dsel';ssel.title='Sync mode';
    [['bpm','BPM Sync'],['free','Free Hz'],['audio','Audio Follow']]
      .forEach(([v,t])=>ssel.appendChild(new Option(t,v)));
    ssel.value=cfg.sync;
    const busSel=document.createElement('select');busSel.className='dsel';busSel.title='Audio bus';
    ['bass','mid','high'].forEach(b2=>busSel.appendChild(new Option(b2[0].toUpperCase()+b2.slice(1),b2)));
    busSel.value=cfg.bus;
    busSel.style.display=cfg.sync==='audio'?'':'none';
    ssel.addEventListener('change',()=>{
      cfg.sync=ssel.value;busSel.style.display=cfg.sync==='audio'?'':'none';saveState();});
    busSel.addEventListener('change',()=>{cfg.bus=busSel.value;saveState();});
    sy.appendChild(ssel);sy.appendChild(busSel);b.appendChild(sy);
    paramRow(b,pre+'Rate','Rate');paramRow(b,pre+'Depth','Depth');
    paramRow(b,pre+'Phase','Phase');toggleRow(b,pre+'Bip','Bipolar');
    const tg=el('div');b.appendChild(tg);
    const refresh=()=>{tg.innerHTML='';drawModTargets(tg,i,m,refresh);};
    refresh();
    const add=el('button','mbtn','+ route target');
    add.title='Route this modulator to a cloner param (up to 4)';
    add.addEventListener('click',()=>{
      if(cfg.targets.length<4){
        const opts=clonerParamOptions(i);
        cfg.targets.push({id:opts[0].id,depth:0.5});
        saveState();refresh();
      }
    });
    b.appendChild(add);
  }
}

</script>
<script>
'use strict';
/* ================= SHADER PLUGIN DEFAULT =================
   Documented for the plugin editor. The engine prepends uniform +
   helper declarations, so user code must NOT redeclare them. */
const PLUGIN_DEFAULT =
'// HoloMapper shader plugin — GLSL ES 3.00.\n' +
'// The engine declares these for you (do NOT redeclare):\n' +
'//   uniforms: u_time, u_res, u_speed, u_hue,\n' +
'//             u_audioBass, u_audioMid, u_audioHigh, u_beat,\n' +
'//             u_param1, u_param2\n' +
'//   helpers:  hsv(vec3), hash12(vec2), vnoise(vec2), fbm(vec2)\n' +
'//   output:   out vec4 O  (write your color here)\n' +
'// Entry point: void main() { ... O = vec4(color, 1.0); }\n' +
'void main(){\n' +
'  vec2 uv = (gl_FragCoord.xy - 0.5*u_res)/u_res.y;\n' +
'  float t = u_time*u_speed;\n' +
'  vec2 p = uv*3.0;\n' +
'  p += 0.9*vec2(sin(p.y*2.0 + t*1.1), cos(p.x*2.0 - t*1.4));\n' +
'  float v = sin(p.x*2.2 + t*2.0) + sin(p.y*1.8 - t*1.5) + sin((p.x+p.y)*1.6 + t*0.7);\n' +
'  v = 0.5 + 0.5*v/3.0;\n' +
'  vec3 col = hsv(vec3(fract(u_hue + v*0.5 + t*0.04), 0.85, pow(v, 1.2 + u_param1*1.5)));\n' +
'  col *= 0.8 + u_beat*0.4;\n' +
'  O = vec4(col, 1.0);\n' +
'}\n';

/* ================= PARAMETER MODEL =================
   Every learnable / macro-able parameter, stored normalized 0..1.
   map: normalized -> real uniform value.  fmt: normalized -> readout. */
const PARAMS = {};
function defParam(id, label, defN, map, fmt){
  PARAMS[id] = { id, label, def: defN,
    map: map || (v=>v),
    fmt: fmt || (v=>Math.round(v*100)+'%') };
}
const LAYER_NAMES = ['L1','L2','L3','L4'];
const LAYER_HUES  = [0.02, 0.38, 0.62, 0.15];
const LAYER_SRC   = ['Tunnel','Flow Field','Nebula','Plugin','Cloner 3D','Camera'];
const BLENDS      = ['Normal','Add','Screen','Multiply','Overlay','Difference'];
/* Cloner 3D option lists (shared by param defs and UI builders) */
const CL_MODES=['Grid','Radial','Linear'];
const CL_MESHES=['Icosahedron','Torus Knot','Box','Tetra','Torus','Cone','Cylinder','Capsule','Helix','Star','Gem','Diamond','Flower','Particles'];
const CL_FALLS=['Infinite','Linear','Sphere','Box'];
const CL_SND=['Bass','Mid','High','Beat'];
const CL_PLANES=['XY','XZ','YZ'];
for(let i=0;i<4;i++){
  const p = 'L'+i+'.';
  defParam(p+'op',   LAYER_NAMES[i]+' Opacity', 1,   v=>v, v=>Math.round(v*100)+'%');
  defParam(p+'speed',LAYER_NAMES[i]+' Speed',   0.5, v=>v*2, v=>(v*2).toFixed(2)+'x');
  defParam(p+'hue',  LAYER_NAMES[i]+' Hue',     LAYER_HUES[i], v=>v, v=>Math.round(v*360)+'\u00B0');
  defParam(p+'audio',LAYER_NAMES[i]+' Audio',   0.6);
  defParam(p+'p1',   LAYER_NAMES[i]+' Param 1', 0.5);
  defParam(p+'p2',   LAYER_NAMES[i]+' Param 2', 0.5);
}
/* ---- Cloner 3D params (per layer). Every one flows through the standard
   param system: MIDI learn, macro assign + depth, presets, phone remote. ---- */
const clIntMap=(lo,hi)=>v=>Math.round(lo+v*(hi-lo));
const clIntFmt=(lo,hi)=>v=>String(Math.round(lo+v*(hi-lo)));
const clDiscMap=n=>v=>Math.min(n-1,Math.round(v*(n-1)));
const clDiscFmt=opts=>v=>opts[Math.min(opts.length-1,Math.round(v*(opts.length-1)))];
const clTglFmt=v=>(v>=0.5?'on':'off');
/* Layer source as a real param: clip firing flows through setParam so MIDI
   learn, macro assign, presets and the phone remote keep working. The render
   loop keeps reading S.layers[i].src; PARAM_HOOKS (registered in the deck
   section below) mirrors the param into it. */
const SRC_DEF=[0, 0.4, 0.2, 0.6]; /* default src index /5 per layer -> [0,2,1,3] */
for(let i=0;i<4;i++){
  defParam('L'+i+'.src', LAYER_NAMES[i]+' Source', SRC_DEF[i], clDiscMap(6), clDiscFmt(LAYER_SRC));
}
for(let i=0;i<4;i++){
  const c='L'+i+'.cl', LB=LAYER_NAMES[i]+' ';
  /* cloner mode */
  defParam(c+'Mode',LB+'Cloner Mode',0, clDiscMap(3), clDiscFmt(CL_MODES));
  defParam(c+'CntX',LB+'Count X',5/11, clIntMap(1,12), clIntFmt(1,12));
  defParam(c+'CntY',LB+'Count Y',5/11, clIntMap(1,12), clIntFmt(1,12));
  defParam(c+'CntZ',LB+'Count Z',0,    clIntMap(1,12), clIntFmt(1,12));
  defParam(c+'SpX',LB+'Space X',0.36, v=>0.2+v*2.8, v=>(0.2+v*2.8).toFixed(2));
  defParam(c+'SpY',LB+'Space Y',0.36, v=>0.2+v*2.8, v=>(0.2+v*2.8).toFixed(2));
  defParam(c+'SpZ',LB+'Space Z',0.36, v=>0.2+v*2.8, v=>(0.2+v*2.8).toFixed(2));
  defParam(c+'RCnt',LB+'Radial Count',63/254, clIntMap(2,256), clIntFmt(2,256));
  defParam(c+'Rad',LB+'Radial Radius',0.33, v=>0.5+v*7.5, v=>(0.5+v*7.5).toFixed(2));
  defParam(c+'Arc',LB+'Radial Arc',1, v=>v*360, v=>Math.round(v*360)+'\u00B0');
  defParam(c+'Plane',LB+'Radial Plane',0, clDiscMap(3), clDiscFmt(CL_PLANES));
  defParam(c+'LCnt',LB+'Linear Count',46/254, clIntMap(2,256), clIntFmt(2,256));
  defParam(c+'StpX',LB+'Step X',0.575, v=>(v-0.5)*4, v=>((v-0.5)*4).toFixed(2));
  defParam(c+'StpY',LB+'Step Y',0.5,   v=>(v-0.5)*4, v=>((v-0.5)*4).toFixed(2));
  defParam(c+'StpZ',LB+'Step Z',0.5,   v=>(v-0.5)*4, v=>((v-0.5)*4).toFixed(2));
  /* mesh */
  defParam(c+'Mesh',LB+'Mesh',0, clDiscMap(14), clDiscFmt(CL_MESHES));
  defParam(c+'Flat',LB+'Flat Shade',0, v=>v, clTglFmt);
  defParam(c+'Wire',LB+'Wireframe',0, v=>v, clTglFmt);
  defParam(c+'IScl',LB+'Instance Scale',0.22, v=>0.1+v*1.9, v=>(0.1+v*1.9).toFixed(2));
  defParam(c+'HueR',LB+'Hue Range',0.35);
  defParam(c+'Sat',LB+'Saturation',0.57, v=>v*1.5, v=>(v*1.5).toFixed(2));
  /* plain effector */
  defParam(c+'POn',LB+'Plain On',1, v=>v, clTglFmt);
  defParam(c+'PPos',LB+'Plain Pos On',1, v=>v, clTglFmt);
  defParam(c+'PRt',LB+'Plain Rot On',0, v=>v, clTglFmt);
  defParam(c+'PSl',LB+'Plain Scl On',1, v=>v, clTglFmt);
  defParam(c+'PStr',LB+'Plain Strength',0.5, v=>v*2, v=>(v*2).toFixed(2));
  defParam(c+'PPx',LB+'Plain Pos X',0.5, v=>(v-0.5)*2, v=>((v-0.5)*2).toFixed(2));
  defParam(c+'PPy',LB+'Plain Pos Y',1,   v=>(v-0.5)*2, v=>((v-0.5)*2).toFixed(2));
  defParam(c+'PPz',LB+'Plain Pos Z',0.5, v=>(v-0.5)*2, v=>((v-0.5)*2).toFixed(2));
  defParam(c+'PRx',LB+'Plain Rot X',0.5, v=>(v-0.5)*360, v=>Math.round((v-0.5)*360)+'\u00B0');
  defParam(c+'PRy',LB+'Plain Rot Y',0.5, v=>(v-0.5)*360, v=>Math.round((v-0.5)*360)+'\u00B0');
  defParam(c+'PRz',LB+'Plain Rot Z',0.5, v=>(v-0.5)*360, v=>Math.round((v-0.5)*360)+'\u00B0');
  defParam(c+'PSx',LB+'Plain Scl X',0.5, v=>v*2, v=>(v*2).toFixed(2));
  defParam(c+'PSy',LB+'Plain Scl Y',0.5, v=>v*2, v=>(v*2).toFixed(2));
  defParam(c+'PSz',LB+'Plain Scl Z',0.5, v=>v*2, v=>(v*2).toFixed(2));
  defParam(c+'PFall',LB+'Falloff',2/3, clDiscMap(4), clDiscFmt(CL_FALLS));
  defParam(c+'PInv',LB+'Falloff Invert',0, v=>v, clTglFmt);
  defParam(c+'PSize',LB+'Falloff Size',0.29, v=>0.2+v*9.8, v=>(0.2+v*9.8).toFixed(1));
  defParam(c+'PSpd',LB+'Falloff Speed',0.15, v=>v*2, v=>(v*2).toFixed(2));
  /* random effector */
  defParam(c+'ROn',LB+'Random On',0, v=>v, clTglFmt);
  defParam(c+'Seed',LB+'Random Seed',7/99, clIntMap(0,99), clIntFmt(0,99));
  defParam(c+'RPx',LB+'Rnd Pos X',0.15, v=>v*2, v=>(v*2).toFixed(2));
  defParam(c+'RPy',LB+'Rnd Pos Y',0.15, v=>v*2, v=>(v*2).toFixed(2));
  defParam(c+'RPz',LB+'Rnd Pos Z',0.15, v=>v*2, v=>(v*2).toFixed(2));
  defParam(c+'RRx',LB+'Rnd Rot X',0.11, v=>v*180, v=>Math.round(v*180)+'\u00B0');

const MOD_LETTERS='ABCDEF';
function defaultMod(){
  return {pts:[[0,0.5],[0.25,1],[0.5,0.5],[0.75,0],[1,0.5]],
          smooth:true, sync:'bpm', bus:'bass', targets:[]};

function defaultMods(){

function sanitizeMods(m){

          ? c.pts.map(p=>[clamp(+p[0]||0,0,1),clamp((+p[1]===undefined?0.5:+p[1]),0,1)])
          : defaultMod().pts;
        pts.sort((a,b)=>a[0]-b[0]);
        return {
          pts:pts, smooth:!!c.smooth,
          sync:['bpm','free','audio'].indexOf(c.sync)>=0?c.sync:'bpm',
          bus:['bass','mid','high'].indexOf(c.bus)>=0?c.bus:'bass',
          rate:clamp(+c.rate||0,0,1), phase:clamp(+c.phase||0,0,1), bip:!!c.bip,

            .map(t=>({id:String(t.id),depth:clamp(+t.depth||0,0,1)}))

const MOD_OFF={};

/* ---- modulator evaluation (v1.2) ---- */
function sampleCurve(pts,ph,smooth){
  const n=pts.length;
  if(n<2) return 0.5;
  let j=0;
  for(let k=0;k<n;k++){ if(pts[k][0]<=ph) j=k; }
  const p0=pts[j], p1=pts[(j+1)%n];
  let x0=p0[0], x1=p1[0];
  if(x1<=x0) x1+=1;
  let f=(ph-x0)/Math.max(x1-x0,1e-6);
  f=clamp(f,0,1);
  if(smooth) f=0.5-0.5*Math.cos(f*Math.PI);
  return p0[1]+(p1[1]-p0[1])*f;
}
function modValue(i,m,t){
  const L=MOD_LETTERS[m], cfg=S.mods[i][m];
  const pre='L'+i+'.clM'+L+'_';
  const rate=eff(pre+'Rate'), phase=eff(pre+'Phase');
  let ph;
  if(cfg.sync==='free'){
    ph=(t*(0.02+rate*7.98)+phase)%1;
  }else if(cfg.sync==='audio'){
    const b=cfg.bus==='mid'?midSm:(cfg.bus==='high'?highSm:bassSm);
    ph=(b+phase)%1;
  }else{
    const divs=[0.5,1,2,4,8,16], bp=divs[Math.min(5,Math.round(rate*5))];
    ph=((t*S.bpm/60)/bp+phase)%1;
  }
  if(ph<0) ph+=1;
  let v=sampleCurve(cfg.pts,ph,cfg.smooth);
  if(eff(pre+'Bip')>0.5) v=v*2-1;
  return v;
}
/* Rebuild MOD_OFF once per frame, before any renderLayer call. */
function evalModulators(t){
  for(const k in MOD_OFF) delete MOD_OFF[k];
  for(let i=0;i<4;i++){
    for(let m=0;m<6;m++){
      const L=MOD_LETTERS[m], cfg=S.mods[i][m];
      if(!cfg.targets.length) continue;
      const d=eff('L'+i+'.clM'+L+'_Depth');
      if(d<=0.001) continue;
      const v=modValue(i,m,t);
      if(v===0) continue;
      for(const tg of cfg.targets){
        if(!PARAMS[tg.id]) continue;
        MOD_OFF[tg.id]=(MOD_OFF[tg.id]||0)+v*d*tg.depth;
      }
    }
  }
}

/* ================= PRISM CAM FX (ported) =================
   FX adapted from Jaiye's Prism Cam — github.com/Dawnjaiye/Dawnjaiye
   (docs/index.html, FS_FX uber-shader). Adapted to mobile's conventions
   (u_tex/v_uv/O naming); includes the 23 effects mobile didn't have.
   Skipped (already covered): kaleido, trails/echo, rgb split, glitch,
   feedback. Vignette + grain MOVED here from the grade pass so every
   effect lives in exactly one place (P.vig/P.grain param ids kept, so
   old presets carry over). */
const SRC_PRISM = `#version 300 es
precision highp float;
out vec4 O;
in vec2 v_uv;
uniform sampler2D u_tex;
uniform vec2 u_res, u_texel;
uniform float u_time;
uniform float u_bypass;
uniform float u_swirl,u_bulge,u_wave,u_pixel;
uniform float u_vhs;
uniform float u_hue,u_poster,u_duo,u_invert;
uniform float u_edge,u_scan,u_grain,u_vig,u_halo;
uniform float u_spin,u_tunnel,u_pulse,u_flow,u_drift;
uniform float u_stars,u_rays,u_shake;
uniform float u_prism,u_plasma;
float hash(float n){return fract(sin(n*127.1)*43758.5453);}
float hash2(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec3 rgb2hsv(vec3 c){
  vec4 K=vec4(0.0,-1.0/3.0,2.0/3.0,-1.0);
  vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));
  vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));
  float d=q.x-min(q.w,q.y); float e=1.0e-10;
  return vec3(abs(q.z+(q.w-q.y)/(6.0*d+e)),d/(q.x+e),q.x);
}
vec3 hsv2rgb(vec3 c){
  vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0);
  vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www);
  return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y);
}
float lumAt(vec2 p){return dot(texture(u_tex,p).rgb,vec3(0.299,0.587,0.114));}
void main(){
  vec3 c0 = texture(u_tex,v_uv).rgb;
  if(u_bypass>0.5){ O = vec4(c0,1.0); return; }
  float t=u_time;
  vec2 uv=v_uv;
  if(u_swirl>0.001){
    vec2 c=uv-0.5; float r=length(c);
    float ang=u_swirl*exp(-r*r*7.0);
    float s=sin(ang),co=cos(ang);
    uv=vec2(co*c.x-s*c.y,s*c.x+co*c.y)+0.5;
  }
  if(u_bulge>0.001){
    vec2 c=uv-0.5; float r=length(c);
    uv=c*(1.0-u_bulge*0.38*exp(-r*r*8.0))+0.5;
  }
  if(u_wave>0.001){
    uv.x+=sin(uv.y*24.0+t*3.0)*0.022*u_wave;
    uv.y+=cos(uv.x*20.0-t*2.2)*0.022*u_wave;
  }
  if(u_spin>0.001){
    vec2 c=uv-0.5;
    float a=t*0.9*u_spin;
    float s=sin(a),co=cos(a);
    uv=vec2(co*c.x-s*c.y,s*c.x+co*c.y)+0.5;
  }
  if(u_tunnel>0.001){
    vec2 c=uv-0.5; float r=length(c);
    float puls=1.0+0.32*u_tunnel*sin(t*2.2*u_tunnel-r*9.0);
    uv=c*puls+0.5;
  }
  if(u_pulse>0.001){
    vec2 c=uv-0.5; float r=max(length(c),1e-4);
    float w=sin(r*30.0-t*4.5*u_pulse)*0.035*u_pulse;
    uv+=c/r*w;
  }
  if(u_flow>0.001){
    vec2 p=uv*3.0;
    float n1=sin(p.x*2.1+t*0.7)+sin(p.y*1.7-t*0.5)+sin((p.x+p.y)*1.3+t*0.3);
    float n2=cos(p.x*1.9-t*0.6)+cos(p.y*2.3+t*0.4)+cos((p.x-p.y)*1.1-t*0.2);
    uv+=vec2(n1,n2)*0.028*u_flow;
    vec2 q=uv*5.0-vec2(n1,n2)*0.8;
    uv+=vec2(sin(q.y*2.0+t*1.1),cos(q.x*2.0-t*0.9))*0.014*u_flow;
  }
  if(u_drift>0.001){
    float row=floor(uv.y*24.0);
    float ph=hash(row*7.13)*6.2831;
    uv.x+=sin(t*1.3*u_drift+ph)*0.07*u_drift;
  }
  if(u_shake>0.001){
    float st=floor(t*18.0);
    vec2 sh=(vec2(hash2(vec2(st,1.7)),hash2(vec2(st,9.2)))-0.5)*0.055*u_shake;
    uv+=sh;
  }
  vec2 chroma=vec2(0.0);
  if(u_vhs>0.001) chroma.x=sin(uv.y*90.0+t*13.0)*0.004*u_vhs;
  if(u_pixel>0.5){
    vec2 grid=vec2(u_pixel,u_pixel*u_res.y/u_res.x);
    uv=(floor(uv*grid)+0.5)/grid;
  }
  vec3 col;
  if(u_vhs>0.001){
    vec2 roff=chroma;
    col=vec3(texture(u_tex,uv+roff).r,texture(u_tex,uv).g,texture(u_tex,uv-roff).b);
  }else{
    col=texture(u_tex,uv).rgb;
  }
  if(u_vhs>0.001){
    float barPos=fract(t*0.11);
    float bar=smoothstep(0.045,0.0,abs(v_uv.y-barPos));
    col=mix(col,vec3(0.85,0.9,0.95),bar*0.5*u_vhs);
    float n=hash2(vec2(floor(v_uv.x*240.0),floor(v_uv.y*135.0))+floor(t*24.0)*0.37);
    col+=(n-0.5)*0.22*u_vhs;
    col*=1.0-0.10*u_vhs;
  }
  if(u_prism>0.001){
    vec2 c=uv-0.5; float r=max(length(c),1e-4);
    vec2 dir=c/r;
    float off=(0.004+0.011*(0.5+0.5*sin(t*1.6)))*u_prism;
    col.r=texture(u_tex,uv+dir*off*r*2.5).r;
    col.b=texture(u_tex,uv-dir*off*r*2.5).b;
  }
  if(u_plasma>0.001){
    vec2 p=uv*4.0;
    float pl=sin(p.x*1.5+t*0.6)+sin(p.y*2.0-t*0.4)+sin((p.x+p.y)*1.2+t*0.5)+sin(length(p)*1.8-t*0.7);
    pl=pl*0.25+0.5;
    vec3 pc=mix(vec3(0.10,0.20,0.90),vec3(0.90,0.30,0.70),pl);
    pc=mix(pc,vec3(0.20,0.90,0.80),0.5+0.5*sin(pl*6.2831+t*0.8));
    col=mix(col,pc,0.38*clamp(u_plasma,0.0,1.5));
  }
  if(u_hue>0.001){
    vec3 hsv=rgb2hsv(col);
    hsv.x=fract(hsv.x+t*0.06*u_hue);
    hsv.y=clamp(hsv.y*(0.7+0.6*u_hue),0.0,1.0);
    col=hsv2rgb(hsv);
  }
  if(u_poster>0.5) col=floor(col*u_poster+0.5)/u_poster;
  if(u_duo>0.001){
    float g=dot(col,vec3(0.299,0.587,0.114));
    col=mix(col,mix(vec3(0.015,0.02,0.07),vec3(1.0,0.85,0.55),g),u_duo);
  }
  if(u_invert>0.001) col=mix(col,vec3(1.0)-col,u_invert);
  if(u_edge>0.001){
    vec2 e=u_texel;
    float tl=lumAt(uv+vec2(-e.x,-e.y)), tc=lumAt(uv+vec2(0.0,-e.y)), tr=lumAt(uv+vec2(e.x,-e.y));
    float ml=lumAt(uv+vec2(-e.x,0.0)), mr=lumAt(uv+vec2(e.x,0.0));
    float bl=lumAt(uv+vec2(-e.x,e.y)), bc=lumAt(uv+vec2(0.0,e.y)), br=lumAt(uv+vec2(e.x,e.y));
    float gx=-tl-2.0*ml-bl+tr+2.0*mr+br;
    float gy=-tl-2.0*tc-tr+bl+2.0*bc+br;
    float line=smoothstep(0.12,0.5,sqrt(gx*gx+gy*gy));
    vec3 glow=vec3(0.72,0.84,1.0)*(0.5+1.1*line);
    col=mix(col,col*0.10+glow*line,u_edge);
  }
  if(u_rays>0.001){
    vec2 c=uv-0.5; c.x*=u_res.x/u_res.y;
    float a=atan(c.y,c.x);
    float ry=pow(0.5+0.5*sin(a*16.0+t*0.9*u_rays),3.0);
    float m=smoothstep(0.75,0.08,length(c));
    col+=vec3(1.0,0.82,0.55)*ry*m*0.38*u_rays;
  }
  if(u_stars>0.001){
    vec2 sp=uv-0.5; sp.x*=u_res.x/u_res.y;
    vec3 acc=vec3(0.0);
    for(int i=0;i<3;i++){
      float fi=float(i);
      for(int j=0;j<20;j++){
        float fj=float(j);
        float h1=hash2(vec2(fj*12.9+fi*7.0,fi*78.2));
        float h2=hash2(vec2(fj*39.3+fi*3.0,fi*11.7+5.0));
        float h3=hash2(vec2(fj*73.7,fi*5.3+9.0));
        float ang=h1*6.2831+fi*2.094;
        float z=fract(h2-t*(0.05+0.30*h3)*u_stars);
        float rr=(1.0-z); rr*=rr;
        vec2 pos=vec2(cos(ang),sin(ang))*rr*0.85;
        float d=length(sp-pos);
        float tw=0.6+0.4*sin(t*9.0*h1+h2*40.0);
        float b=smoothstep(0.018,0.0,d)*z*tw;
        acc+=mix(vec3(0.60,0.75,1.0),vec3(1.0,0.88,0.70),h3)*b;
      }
    }
    col+=acc*0.6*min(u_stars,1.5);
  }
  if(u_halo>0.001){
    vec2 g=uv*u_res/7.0;
    float lum=dot(col,vec3(0.299,0.587,0.114));
    float pulse=1.0+0.22*clamp(u_halo,0.0,1.5)*sin(t*2.5);
    float rad=clamp((1.0-lum)*0.72*pulse,0.0,0.72);
    float d=length(fract(g)-0.5);
    float ink=smoothstep(rad,rad-0.10,d);
    vec3 ht=mix(vec3(0.94,0.93,0.90),vec3(0.03,0.03,0.06),ink);
    col=mix(col,ht,clamp(u_halo,0.0,1.0));
  }
  if(u_scan>0.001) col*=1.0-u_scan*0.22*(0.5+0.5*sin(v_uv.y*u_res.y*3.14159));
  if(u_grain>0.001) col+=(hash2(v_uv*913.7+fract(t)*7.31)-0.5)*0.28*u_grain;
  if(u_vig>0.001){vec2 vc=v_uv-0.5; col*=1.0-u_vig*1.1*dot(vc,vc);}
  O=vec4(col,1.0);
}`;

const SRC_GRADE = `#version 300 es

function compileShader(type, src){
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if(!gl.getShaderParameter(sh, gl.COMPILE_STATUS)){
    lastGlslErr = gl.getShaderInfoLog(sh) || 'unknown compile error';
    gl.deleteShader(sh);
    return null;
  }
  return sh;
}
function makeProgram(vsSrc, fsSrc){
  const vs = compileShader(gl.VERTEX_SHADER, vsSrc);
  if(!vs) return null;
  const fs = compileShader(gl.FRAGMENT_SHADER, fsSrc);
  if(!fs){ gl.deleteShader(vs); return null; }
  const pr = gl.createProgram();
  gl.attachShader(pr,vs); gl.attachShader(pr,fs); gl.linkProgram(pr);
  gl.deleteShader(vs); gl.deleteShader(fs);
  if(!gl.getProgramParameter(pr, gl.LINK_STATUS)){
    lastGlslErr = gl.getProgramInfoLog(pr) || 'link error';
    gl.deleteProgram(pr);
    return null;
  }
  return pr;
}
/* cached uniform locations */
function U(prog, name){
  prog._u = prog._u || {};
  if(!(name in prog._u)) prog._u[name] = gl.getUniformLocation(prog, name);
  return prog._u[name];
}
function setTex(prog, name, unit, tex){
  gl.activeTexture(gl.TEXTURE0+unit);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(U(prog,name), unit);
}

  quadBuf = gl.createBuffer();

  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
}
function drawQuad(prog){

  gl.enableVertexAttribArray(0);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

}
function makeTarget(w,h,depth,byte){
  const tex = gl.createTexture();

  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if(floatOK && !byte) gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  else                 gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8,  w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  if(depth){
    const rb = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, rb);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, rb);
    gl.bindRenderbuffer(gl.RENDERBUFFER, null);
  }
  const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER)===gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return {tex:tex, fb:fb, w:w, h:h, ok:ok};
}

  c+=(texture(u_tex,v_uv+o2).rgb+texture(u_tex,v_uv-o2).rgb)*0.0702703;
  O=vec4(c,1.0);
}`;
const SRC_BLOOMADD=`#version 300 es
precision highp float;
out vec4 O;
in vec2 v_uv;
uniform sampler2D u_tex;
uniform float u_strength;
void main(){
  O=vec4(texture(u_tex,v_uv).rgb*u_strength,1.0);
}`;
/* ---- ground plane shader (v1.2): soft shadow + animated caustic shimmer ---- */
const CL_GROUND_VERT=`#version 300 es
layout(location=0) in vec3 a_pos;
uniform mat4 u_vp;
uniform float u_gndY;
out vec3 v_w;
void main(){
  vec3 w=vec3(a_pos.x,u_gndY,a_pos.z);
  v_w=w;
  gl_Position=u_vp*vec4(w,1.0);
}`;
const CL_GROUND_FRAG=`#version 300 es
precision highp float;
out vec4 O;
in vec3 v_w;
uniform float u_time;
float h31(vec3 p){
  p=fract(p*0.3183099+vec3(0.11,0.17,0.13));
  p*=19.19;
  return fract(p.x*p.y*p.z*(p.x+p.y+p.z));
}
float vn3(vec3 p){
  vec3 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=h31(i),b=h31(i+vec3(1.,0.,0.)),c=h31(i+vec3(0.,1.,0.)),d=h31(i+vec3(1.,1.,0.));
  float e=h31(i+vec3(0.,0.,1.)),g=h31(i+vec3(1.,0.,1.)),h=h31(i+vec3(0.,1.,1.)),k=h31(i+vec3(1.,1.,1.));
  return mix(mix(mix(a,b,f.x),mix(c,d,f.x),f.y),mix(mix(e,g,f.x),mix(h,k,f.x),f.y),f.z);
}
void main(){
  float r=length(v_w.xz);
  float shadow=exp(-r*r/14.0)*0.6;
  float c1=vn3(vec3(v_w.xz*1.4,u_time*0.45));
  float c2=vn3(vec3(v_w.xz*1.4+7.3,-u_time*0.32));
  float ca=pow(clamp(c1*c2*4.2,0.0,1.0),3.0);
  float fade=exp(-r*r/220.0);
  vec3 col=vec3(0.30,0.62,0.85)*ca*0.55*(1.0-shadow)*fade;
  col+=vec3(0.02,0.03,0.06)*(1.0-shadow)*fade;
  O=vec4(col,1.0);
}`;

/* ---- tiny mat4 helpers (column-major) ---- */
function m4persp(fovy,asp,n,f){
  const t=1/Math.tan(fovy/2), o=new Float32Array(16);
  o[0]=t/asp; o[5]=t; o[10]=(f+n)/(n-f); o[11]=-1; o[14]=2*f*n/(n-f);
  return o;
}
function m4look(eye,c,up){
  let z=[eye[0]-c[0],eye[1]-c[1],eye[2]-c[2]];
  let l=Math.hypot(z[0],z[1],z[2])||1; z=[z[0]/l,z[1]/l,z[2]/l];
  let x=[up[1]*z[2]-up[2]*z[1],up[2]*z[0]-up[0]*z[2],up[0]*z[1]-up[1]*z[0]];
  l=Math.hypot(x[0],x[1],x[2])||1; x=[x[0]/l,x[1]/l,x[2]/l];
  const y=[z[1]*x[2]-z[2]*x[1],z[2]*x[0]-z[0]*x[2],z[0]*x[1]-z[1]*x[0]];
  const o=new Float32Array(16);
  o[0]=x[0];o[1]=y[0];o[2]=z[0];
  o[4]=x[1];o[5]=y[1];o[6]=z[1];
  o[8]=x[2];o[9]=y[2];o[10]=z[2];
  o[12]=-(x[0]*eye[0]+x[1]*eye[1]+x[2]*eye[2]);
  o[13]=-(y[0]*eye[0]+y[1]*eye[1]+y[2]*eye[2]);
  o[14]=-(z[0]*eye[0]+z[1]*eye[1]+z[2]*eye[2]);
  o[15]=1;
  return o;
}
function m4mul(a,b){
  const o=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++){
    let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k];
    o[c*4+r]=s;
  }
  return o;
}

/* ---- per-layer instance buffers ---- */
const clonerDirty=[true,true,true,true];
let clInstBuf=[null,null,null,null], clInstRnd=[null,null,null,null], clInstCount=[0,0,0,0];
function clv(i,n){
  const id='L'+i+'.cl'+n;
  return PARAMS[id].map(eff(id));
}
function rebuildClonerInstances(i){
  const mode=clv(i,'Mode'), meshIdx=clv(i,'Mesh'), positions=[];
  const push=(x,y,z)=>positions.push(x,y,z);
  if(meshIdx===13){
    /* ---- particles: emission shape replaces the cloner layout ---- */
    const n=clv(i,'PtN'), shape=clv(i,'PtShape');
    let pseed=Math.floor(clv(i,'Seed')*1000)+i*131+7;
    const rnd=()=>{pseed=(pseed*16807)%2147483647;return (pseed-1)/2147483646;};
    for(let k=0;k<n;k++){
      if(shape===0) push((rnd()*2-1)*2.2,(rnd()*2-1)*2.2,(rnd()*2-1)*2.2);
      else if(shape===1){
        const th=rnd()*6.28318,ph=Math.acos(clamp(rnd()*2-1,-1,1)),r=2.2*Math.cbrt(rnd());
        push(r*Math.sin(ph)*Math.cos(th),r*Math.cos(ph),r*Math.sin(ph)*Math.sin(th));
      }else{
        const a=rnd()*6.28318,r=2.6*Math.sqrt(rnd());
        push(r*Math.cos(a),(rnd()*2-1)*0.3,r*Math.sin(a));
      }
    }
  }else if(mode===0){
    const nx=clv(i,'CntX'),ny=clv(i,'CntY'),nz=clv(i,'CntZ');
    const sx=clv(i,'SpX'),sy=clv(i,'SpY'),sz=clv(i,'SpZ');
    for(let ix=0;ix<nx;ix++)for(let iy=0;iy<ny;iy++)for(let iz=0;iz<nz;iz++)
      push((ix-(nx-1)/2)*sx,(iy-(ny-1)/2)*sy,(iz-(nz-1)/2)*sz);
  }else if(mode===1){
    const n=clv(i,'RCnt'),R=clv(i,'Rad'),arc=clv(i,'Arc')*Math.PI/180,pl=clv(i,'Plane');
    for(let k=0;k<n;k++){
      const a=(n<=1?0:(k/(n-1))*arc), ca=Math.cos(a)*R, sa=Math.sin(a)*R;
      if(pl===0) push(ca,sa,0);
      else if(pl===1) push(ca,0,sa);
      else push(0,ca,sa);
    }
  }else{
    const n=clv(i,'LCnt'),sx=clv(i,'StpX'),sy=clv(i,'StpY'),sz=clv(i,'StpZ');
    for(let k=0;k<n;k++) push((k-(n-1)/2)*sx,(k-(n-1)/2)*sy,(k-(n-1)/2)*sz);
  }
  const count=positions.length/3;
  let seed=Math.floor(clv(i,'Seed')*1000)+i*77+1;
  const rndArr=new Float32Array(count);
  for(let k=0;k<count;k++){
    seed=(seed*16807)%2147483647;
    rndArr[k]=(seed-1)/2147483646;
  }
  if(!clInstBuf[i]){ clInstBuf[i]=gl.createBuffer(); clInstRnd[i]=gl.createBuffer(); }
  gl.bindBuffer(gl.ARRAY_BUFFER,clInstBuf[i]);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(positions),gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,clInstRnd[i]);
  gl.bufferData(gl.ARRAY_BUFFER,rndArr,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,null);
  clInstCount[i]=count;
  clonerDirty[i]=false;
}

/* ---- per-layer flower geometry (v1.2): rebuilt when quantized flower params change ---- */
const clFlowerDat=[null,null,null,null];
function flowerKey(i){
  const q=v=>Math.round(v*64);
  return [clv(i,'FPet'),q(clv(i,'FLen')),q(clv(i,'FWid')),q(clv(i,'FCurl')),
          q(clv(i,'FBud')),clv(i,'FStem')>0.5?1:0].join(':');
}
function buildFlowerGeo(i){
  const key=flowerKey(i);
  let d=clFlowerDat[i];
  if(d&&d.key===key) return d;
  const g=clBuildFlower({pet:clv(i,'FPet'),len:clv(i,'FLen'),wid:clv(i,'FWid'),
                         curl:clv(i,'FCurl'),bud:clv(i,'FBud'),
                         stem:clv(i,'FStem')>0.5?1:0});
  if(!d){
    d={}; clFlowerDat[i]=d;
    d.pos=gl.createBuffer(); d.nor=gl.createBuffer();
    d.idx=gl.createBuffer(); d.flw=gl.createBuffer();
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,d.pos); gl.bufferData(gl.ARRAY_BUFFER,g.pos,gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,d.nor); gl.bufferData(gl.ARRAY_BUFFER,g.nor,gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,d.flw); gl.bufferData(gl.ARRAY_BUFFER,g.flw,gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,d.idx); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,g.idx,gl.DYNAMIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,null); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,null);
  d.n=g.idx.length; d.key=key;
  return d;
}

/* ---- cloner bloom pass (v1.2): bright-pass -> 2x blur -> additive back onto the layer ---- */
function renderClonerBloom(i,T){
  const th=clv(i,'BlmT'), st=clv(i,'BlmS');
  if(!(bloomT[0]&&bloomT[0].ok)) return;
  let P=PROG.bloombp;
  gl.useProgram(P); setTex(P,'u_tex',0,T.tex);
  gl.uniform1f(U(P,'u_thresh'),th);
  gl.bindFramebuffer(gl.FRAMEBUFFER,bloomT[0].fb);
  gl.viewport(0,0,bloomT[0].w,bloomT[0].h);
  quadDraw();
  P=PROG.bloomblur;
  gl.useProgram(P);
  for(let k=0;k<2;k++){
    const src=bloomT[k%2], dst=bloomT[1-k%2];
    setTex(P,'u_tex',0,src.tex);
    gl.uniform2f(U(P,'u_texel'),1/src.w,1/src.h);
    gl.bindFramebuffer(gl.FRAMEBUFFER,dst.fb);
    gl.viewport(0,0,dst.w,dst.h);
    quadDraw();
  }
  P=PROG.bloomadd;
  gl.useProgram(P); setTex(P,'u_tex',0,bloomT[0].tex);
  gl.uniform1f(U(P,'u_strength'),st);
  gl.bindFramebuffer(gl.FRAMEBUFFER,T.fb);
  gl.viewport(0,0,T.w,T.h);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE,gl.ONE);
  quadDraw();
  gl.disable(gl.BLEND);
  gl.bindTexture(gl.TEXTURE_2D,null);
}

/* ---- the cloner render pass ---- */
function renderCloner(i,t,T){
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  if(!layerEnabled(i)) return;
  ensureClonerGL();
  const P=PROG.cloner;
  if(!P||!CLGEO) return;
  if(clonerDirty[i]) rebuildClonerInstances(i);
  if(!clInstCount[i]) return;
  const aud=eff('L'+i+'.audio')*eff('P.aamt');
  let sp=PARAMS['L'+i+'.speed'].map(eff('L'+i+'.speed'));
  if(S.beatSync) sp=snapBeat(sp);
  const ct=t*sp;
  /* camera: orbit azimuth + elevation + distance */
  let az=clv(i,'Az')*Math.PI*2;
  if(clv(i,'Orb')>0.5) az+=ct*0.12;
  const elv=(clv(i,'El')-0.5)*2.6, dist=clv(i,'Dist');
  const eye=[dist*Math.cos(elv)*Math.cos(az),dist*Math.sin(elv),dist*Math.cos(elv)*Math.sin(az)];
  const vp=m4mul(m4persp(0.785,T.w/T.h,0.1,120),m4look(eye,[0,0,0],[0,1,0]));
  /* camera basis for particle billboarding: right = fwd x up, up2 = right x fwd */
  const fw=[-eye[0],-eye[1],-eye[2]], fl=Math.hypot(fw[0],fw[1],fw[2])||1;
  fw[0]/=fl; fw[1]/=fl; fw[2]/=fl;
  let cr=[fw[1]*0-fw[2]*1, fw[2]*0-fw[0]*0, fw[0]*1-fw[1]*0];
  const rl=Math.hypot(cr[0],cr[1],cr[2])||1; cr=[cr[0]/rl,cr[1]/rl,cr[2]/rl];
  const cu=[cr[1]*fw[2]-cr[2]*fw[1], cr[2]*fw[0]-cr[0]*fw[2], cr[0]*fw[1]-cr[1]*fw[0]];
  const meshIdx=clv(i,'Mesh');
  const isFlower=meshIdx===12, isParticle=meshIdx===13;
  let g;
  if(isFlower){ const fg=buildFlowerGeo(i); g={pos:fg.pos,nor:fg.nor,idx:fg.idx,n:fg.n,flw:fg.flw}; }
  else if(isParticle){ g=CLGEO[12]; } /* quad billboard */
  else g=CLGEO[meshIdx];
  /* ground plane first (v1.2), so instances depth-test over it */
  if(clv(i,'Ground')>0.5 && PROG.clground && CLGND){
    const G=PROG.clground;
    gl.useProgram(G);
    gl.bindBuffer(gl.ARRAY_BUFFER,CLGND.pos);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
    gl.uniformMatrix4fv(U(G,'u_vp'),false,vp);
    gl.uniform1f(U(G,'u_gndY'),-2.4);
    gl.uniform1f(U(G,'u_time'),ct);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
    gl.drawArrays(gl.TRIANGLES,0,6);
    gl.disableVertexAttribArray(0);
    gl.bindBuffer(gl.ARRAY_BUFFER,null);
  }
  gl.useProgram(P);
  gl.bindBuffer(gl.ARRAY_BUFFER,g.pos);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0); gl.vertexAttribDivisor(0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,g.nor);
  gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1,3,gl.FLOAT,false,0,0); gl.vertexAttribDivisor(1,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,clInstBuf[i]);
  gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2,3,gl.FLOAT,false,0,0); gl.vertexAttribDivisor(2,1);
  gl.bindBuffer(gl.ARRAY_BUFFER,clInstRnd[i]);
  gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3,1,gl.FLOAT,false,0,0); gl.vertexAttribDivisor(3,1);
  if(isFlower){
    gl.bindBuffer(gl.ARRAY_BUFFER,g.flw);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4,4,gl.FLOAT,false,0,0); gl.vertexAttribDivisor(4,0);
  }else{
    gl.disableVertexAttribArray(4);
  }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,g.idx);
  const F=(n,v)=>gl.uniform1f(U(P,n),v);
  const V3=(n,x,y,z)=>gl.uniform3f(U(P,n),x,y,z);
  const dg=Math.PI/180;
  gl.uniformMatrix4fv(U(P,'u_vp'),false,vp);
  V3('u_camPos',eye[0],eye[1],eye[2]);
  F('u_time',ct);
  F('u_audioBass',bassSm*aud); F('u_audioMid',midSm*aud); F('u_audioHigh',highSm*aud);
  F('u_beat',beatPulse); F('u_hue',eff('L'+i+'.hue'));
  F('u_pOn',clv(i,'POn')); F('u_pPosOn',clv(i,'PPos')); F('u_pRotOn',clv(i,'PRt'));
  F('u_pSclOn',clv(i,'PSl')); F('u_pStr',clv(i,'PStr'));
  V3('u_pPos',clv(i,'PPx'),clv(i,'PPy'),clv(i,'PPz'));
  V3('u_pRot',clv(i,'PRx')*dg,clv(i,'PRy')*dg,clv(i,'PRz')*dg);
  V3('u_pScl',clv(i,'PSx'),clv(i,'PSy'),clv(i,'PSz'));
  gl.uniform1i(U(P,'u_fallShape'),clv(i,'PFall'));
  F('u_fallInv',clv(i,'PInv')); F('u_fallSize',clv(i,'PSize')); F('u_fallSpd',clv(i,'PSpd'));
  F('u_rOn',clv(i,'ROn')); F('u_seed',clv(i,'Seed'));
  V3('u_rPos',clv(i,'RPx'),clv(i,'RPy'),clv(i,'RPz'));
  V3('u_rRot',clv(i,'RRx')*dg,clv(i,'RRy')*dg,clv(i,'RRz')*dg);
  V3('u_rScl',clv(i,'RSx'),clv(i,'RSy'),clv(i,'RSz'));
  F('u_sOn',clv(i,'SOn')); F('u_nScale',clv(i,'SScl')); F('u_nSpd',clv(i,'SSpd'));
  F('u_nAmt',clv(i,'SAmt')); F('u_nSclAmt',clv(i,'SScA'));
  F('u_sndOn',clv(i,'SndOn'));
  gl.uniform1i(U(P,'u_sndSrc'),clv(i,'SndSrc'));
  F('u_sndGain',clv(i,'SndG')); F('u_sndLift',clv(i,'SndL'));
  F('u_dOn',clv(i,'DOn')); F('u_dMax',clv(i,'DAmt'));
  F('u_hueR',clv(i,'HueR')); F('u_sat',clv(i,'Sat')); F('u_instScale',clv(i,'IScl'));
  gl.uniform1i(U(P,'u_flat'),clv(i,'Flat')>0.5?1:0);
  F('u_fogOn',clv(i,'Fog')); F('u_fogD',clv(i,'FogD'));
  F('u_keyI',clv(i,'Key')); F('u_rimI',clv(i,'Rim')); F('u_amb',clv(i,'Amb'));
  /* v1.2 spectral materials */
  gl.uniform1i(U(P,'u_matMode'),clv(i,'Mat'));
  F('u_metal',clv(i,'Metal')); F('u_rough',clv(i,'Rough')); F('u_ior',clv(i,'IOR'));
  F('u_disp',clv(i,'Disp')); F('u_film',clv(i,'Film')); F('u_iri',clv(i,'Iri'));
  F('u_absH',clv(i,'AbsH')); F('u_absD',clv(i,'AbsD')); F('u_envI',clv(i,'Env'));
  F('u_aces',clv(i,'ACES')); F('u_exp',clv(i,'Exp'));
  F('u_flower',isFlower?1:0);
  F('u_bloomAng',0.14+clv(i,'FBloom')*1.26);
  F('u_particle',isParticle?1:0);
  V3('u_camR',cr[0],cr[1],cr[2]); V3('u_camU',cu[0],cu[1],cu[2]);
  F('u_ptLife',clv(i,'PtLife')); F('u_ptSpd',clv(i,'PtSpd')); F('u_ptTurb',clv(i,'PtTurb'));
  F('u_ptSize',clv(i,'PtSize')); F('u_ptDrag',clv(i,'PtDrag'));
  F('u_ptColA',clv(i,'PtColA')); F('u_ptColB',clv(i,'PtColB')); F('u_ptBurst',clv(i,'PtBurst'));
  F('u_wire',0);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL);
  if(isParticle){ gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA,gl.ONE); gl.depthMask(false); }
  gl.drawElementsInstanced(gl.TRIANGLES,g.n,gl.UNSIGNED_INT,0,clInstCount[i]);
  if(isParticle){ gl.disable(gl.BLEND); gl.depthMask(true); }
  if(clv(i,'Wire')>0.5 && !isFlower && !isParticle && g.edge){
    F('u_wire',1);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,g.edge);
    gl.drawElementsInstanced(gl.LINES,g.ne,gl.UNSIGNED_INT,0,clInstCount[i]);
  }
  gl.disable(gl.DEPTH_TEST);
  /* v1.2 bloom on the cloner layer */
  if(clv(i,'Bloom')>0.5) renderClonerBloom(i,T);
  for(let a=0;a<5;a++){ gl.vertexAttribDivisor(a,0); gl.disableVertexAttribArray(a); }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,null);
  gl.bindBuffer(gl.ARRAY_BUFFER,null);
}

</script>
<script>
'use strict';
/* ================= RENDER PIPELINE =================
   layers -> combine -> feedback(ping-pong) -> kaleido -> glitch -> grade -> screen */
const SRC_KEYS = ['tunnel','flow','nebula','plugin','cloner'];
let beatPulse=0;
function snapBeat(v){
  const divs=[0.25,0.5,1,2,4];
  let best=divs[0];
  for(const d of divs) if(Math.abs(d-v)<Math.abs(best-v)) best=d;
  return clamp(best,0,2);
}
function layerEnabled(i){
  const L=S.layers[i];
  const anySolo=S.layers.some(l=>l.solo);
  return !L.bypass && (!anySolo || L.solo);
}
/* Render one source into any target. renderLayer() is the per-layer caller;
   the preview monitor reuses this with the selected clip's source. */
function renderSourceInto(sidx,i,t,T){
  gl.bindFramebuffer(gl.FRAMEBUFFER,T.fb);
  gl.viewport(0,0,T.w,T.h);
  if(sidx===4){ renderCloner(i,t,T); return; }
  if(sidx===5){ renderCamera(i,t,T); return; }
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  const prog=PROG[SRC_KEYS[sidx]];
  if(!prog) return;
  const aud = eff('L'+i+'.audio')*eff('P.aamt');
  let sp = PARAMS['L'+i+'.speed'].map(eff('L'+i+'.speed'));
  if(S.beatSync) sp=snapBeat(sp);
  gl.useProgram(prog);
  gl.uniform1f(U(prog,'u_time'),t);
  gl.uniform2f(U(prog,'u_res'),T.w,T.h);
  gl.uniform1f(U(prog,'u_speed'),sp);
  gl.uniform1f(U(prog,'u_hue'),eff('L'+i+'.hue'));
  gl.uniform1f(U(prog,'u_audioBass'),bassSm*aud);
  gl.uniform1f(U(prog,'u_audioMid'),midSm*aud);
  gl.uniform1f(U(prog,'u_audioHigh'),highSm*aud);
  gl.uniform1f(U(prog,'u_beat'),beatPulse);
  gl.uniform1f(U(prog,'u_param1'),eff('L'+i+'.p1'));
  gl.uniform1f(U(prog,'u_param2'),eff('L'+i+'.p2'));
  quadDraw();
}
function renderLayer(i,t){
  const T=layerT[i];
  if(!layerEnabled(i)){
    gl.bindFramebuffer(gl.FRAMEBUFFER,T.fb);
    gl.viewport(0,0,T.w,T.h);
    gl.clearColor(0,0,0,1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    return;
  }
  renderSourceInto(S.layers[i].src,i,t,T);
}
function renderCombine(){
  const P=PROG.combine;
  gl.bindFramebuffer(gl.FRAMEBUFFER,compT.fb);
  gl.viewport(0,0,compT.w,compT.h);
  gl.useProgram(P);
  for(let i=0;i<4;i++) setTex(P,'u_l'+i,i,layerT[i].tex);
  const op=[],bl=[],en=[];
  for(let i=0;i<4;i++){
    op.push(eff('L'+i+'.op'));
    bl.push(S.layers[i].blend);
    en.push(layerEnabled(i)?1:0);
  }
  gl.uniform4fv(U(P,'u_op'),op);
  gl.uniform4fv(U(P,'u_blend'),bl);

function renderFeedback(){

  gl.uniform1f(U(P,'u_hue'),   PARAMS['P.fbhue'].map(eff('P.fbhue')));
  gl.uniform1f(U(P,'u_sat'),   PARAMS['P.fbsat'].map(eff('P.fbsat')));
  gl.uniform1f(U(P,'u_bypass'),S.postBypass.feedback?1:0);
  quadDraw();
  fbRead=1-fbRead;
}
function renderKaleido(){
  const P=PROG.kaleido;
  gl.bindFramebuffer(gl.FRAMEBUFFER,postT[0].fb);

  setTex(P,'u_tex',0,fbT[fbRead].tex);
  gl.uniform1f(U(P,'u_seg'),PARAMS['P.kseg'].map(eff('P.kseg')));
  gl.uniform1f(U(P,'u_ang'),PARAMS['P.kang'].map(eff('P.kang')));
  gl.uniform1f(U(P,'u_aspect'),RW/RH);

function renderGlitch(t){

/* Prism Cam FX pass (ported from Jaiye's Prism Cam). One fullscreen pass
   for all 23 ported effects; each card toggles S.postBypass['px_'+id] and
   drives its amount param. u_bypass copies through when nothing is on. */
function renderPrism(t){
  const P=PROG.prism;
  gl.bindFramebuffer(gl.FRAMEBUFFER,postT[2].fb);
  gl.viewport(0,0,RW,RH);
  gl.useProgram(P);
  setTex(P,'u_tex',0,postT[1].tex);
  gl.uniform2f(U(P,'u_res'),RW,RH);
  gl.uniform2f(U(P,'u_texel'),1/RW,1/RH);
  gl.uniform1f(U(P,'u_time'),t);
  const px=(uname,pid)=>{ gl.uniform1f(U(P,uname), S.postBypass['px_'+uname.slice(2)]?0:PARAMS[pid].map(eff(pid))); };
  let anyOn=false;
  for(const k of PX_KEYS){ if(!S.postBypass['px_'+k]){ anyOn=true; break; } }
  px('u_swirl','P.px_swirl'); px('u_bulge','P.px_bulge'); px('u_wave','P.px_wave');
  px('u_pixel','P.px_pixel'); px('u_vhs','P.px_vhs');
  px('u_hue','P.px_hue'); px('u_poster','P.px_poster'); px('u_duo','P.px_duo');
  px('u_invert','P.px_invert');
  px('u_edge','P.px_edge'); px('u_scan','P.px_scan');
  px('u_grain','P.grain'); px('u_vig','P.vig'); px('u_halo','P.px_halo');
  px('u_spin','P.px_spin'); px('u_tunnel','P.px_tunnel'); px('u_pulse','P.px_pulse');
  px('u_flow','P.px_flow'); px('u_drift','P.px_drift');
  px('u_stars','P.px_stars'); px('u_rays','P.px_rays'); px('u_shake','P.px_shake');
  px('u_prism','P.px_prism'); px('u_plasma','P.px_plasma');
  gl.uniform1f(U(P,'u_bypass'),anyOn?0:1);
  quadDraw();
}
function renderGrade(t){
  const P=PROG.grade;
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.useProgram(P);
  setTex(P,'u_tex',0,postT[2].tex);
  gl.uniform1f(U(P,'u_bri'),PARAMS['P.bri'].map(eff('P.bri')));
  gl.uniform1f(U(P,'u_con'),PARAMS['P.con'].map(eff('P.con')));
  gl.uniform1f(U(P,'u_sat2'),PARAMS['P.sat'].map(eff('P.sat')));
  gl.uniform1f(U(P,'u_time'),t);
  gl.uniform1f(U(P,'u_master'),PARAMS['P.master'].map(eff('P.master'))*(S.blackout?0:1));
  quadDraw();
  gl.uniform1f(U(P,'u_strobeOn'),S.strobeOn?1:0);
  gl.uniform1f(U(P,'u_strobeRate'),PARAMS['P.srate'].map(eff('P.srate')));
  gl.uniform1f(U(P,'u_strobeAmt'),PARAMS['P.samt'].map(eff('P.samt')));
}

/* ================= AUDIO ENGINE ================= */
let AC=null, analyser=null, micStream=null, audioOn=false;
let bassSm=0, midSm=0, highSm=0, audioBeat=0, lastBeatT=0;
const bassHist=[];
let freqArr=null;
async function toggleAudio(){
  if(audioOn){ stopAudio(); return; }
  $('audiostat').textContent='requesting mic\u2026';
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error('getUserMedia unavailable in this browser');
    micStream = await navigator.mediaDevices.getUserMedia({
      audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
    AC = new (window.AudioContext||window.webkitAudioContext)();
    const src = AC.createMediaStreamSource(micStream);
    analyser = AC.createAnalyser();
    analyser.fftSize=2048;
    analyser.smoothingTimeConstant=0.5;
    src.connect(analyser);
    freqArr = new Float32Array(analyser.frequencyBinCount);
    audioOn=true;
    $('btnAudio').textContent='Disable audio';
    $('btnAudio').classList.add('on');
    $('audiostat').textContent='mic live';
  }catch(err){
    $('audiostat').textContent='mic unavailable';
    showErr('Microphone unavailable ('+((err&&err.message)||err)+') — continuing without audio.');
    setTimeout(()=>$('errbanner').classList.remove('show'), 4500);
  }
}
function stopAudio(){
  try{ if(micStream) micStream.getTracks().forEach(tr=>tr.stop()); }catch(e){}
  try{ if(AC) AC.close(); }catch(e){}
  micStream=null; AC=null; analyser=null; audioOn=false;
  bassSm=midSm=highSm=audioBeat=0;
  $('btnAudio').textContent='Enable audio';
  $('btnAudio').classList.remove('on');
  $('audiostat').textContent='audio off';
}
function pollAudio(){
  if(!audioOn || !analyser) return;
  analyser.getFloatFrequencyData(freqArr);
  const n=freqArr.length, sr=AC.sampleRate;
  const band=(f0,f1)=>{
    let s=0,c=0;
    for(let i=1;i<n;i++){
      const f=i*sr/(2*n);
      if(f>=f0 && f<f1){ s+=Math.max(freqArr[i],-90)+90; c++; }
    }
    return c ? (s/c)/90 : 0;
  };
  const b=band(30,150), m=band(150,2000), h=band(2000,9000);
  bassSm+=(b-bassSm)*0.3; midSm+=(m-midSm)*0.3; highSm+=(h-highSm)*0.3;
  bassHist.push(bassSm); if(bassHist.length>24) bassHist.shift();
  const avg=bassHist.reduce((a,x)=>a+x,0)/bassHist.length;
  const now=performance.now()/1000;
  if(bassSm>avg*1.35+0.08 && now-lastBeatT>0.28){ audioBeat=1; lastBeatT=now; }
  audioBeat*=0.94;
}
function updateMeters(){
  const mb=$('mBass'); if(!mb) return;
  mb.style.height=Math.round(clamp(bassSm,0,1)*100)+'%';
  $('mMid').style.height=Math.round(clamp(midSm,0,1)*100)+'%';
  $('mHigh').style.height=Math.round(clamp(highSm,0,1)*100)+'%';
}
/* tap tempo */
let taps=[];
function tapTempo(){
  const now=performance.now()/1000;
  if(taps.length && now-taps[taps.length-1]>2) taps=[];
  taps.push(now);
  if(taps.length>8) taps.shift();
  if(taps.length>1){
    const iv=(taps[taps.length-1]-taps[0])/(taps.length-1);
    S.bpm=clamp(Math.round(60/iv),40,240);
    $('bpmBig').textContent=S.bpm;
    saveState();
  }
}
