<script>
'use strict';
/* ================= MIDI ================= */
let midiAccess=null;
function midiStatus(txt, armed){
  const s=$('midistat2')||$('midistat');
  if(!s) return;
  s.textContent='MIDI: '+txt;
  s.classList.toggle('armed', !!armed);
}
function setLearn(armed){
  learnArmed=armed;
  if(!armed) pendingCtrl=null;
  const _bl=$('btnLearn'); if(_bl) _bl.classList.toggle('on', armed);
  const _bl2=$('btnLearn2'); if(_bl2) _bl2.classList.toggle('on', armed);
  if(armed) midiStatus('learn armed — click a slider, then wiggle a knob', true);
  else if(midiAccess) midiStatus(midiAccess.inputs.size+' device(s) ready');
}
async function initMidi(){
  if(!navigator.requestMIDIAccess){ midiStatus('Web MIDI not supported in this browser'); return; }
  try{
    midiAccess = await navigator.requestMIDIAccess();
    const refresh=()=>{
      const ins=[...midiAccess.inputs.values()];
      if(!ins.length){ midiStatus('no MIDI devices found'); }
      else{
        if(!learnArmed) midiStatus(ins.length+' device(s): '+ins.map(i=>i.name).join(', '));
        ins.forEach(i=>{ i.onmidimessage=onMidi; });
      }
    };
    midiAccess.onstatechange=refresh;
    refresh();
  }catch(e){ midiStatus('access denied'); }
}
function onMidi(ev){
  const st=ev.data[0], d1=ev.data[1], d2=ev.data[2];
  if((st&0xF0)!==0xB0) return;               /* CC only */
  const ch=st&0x0F;
  if(pendingCtrl && learnArmed){
    bindMidi(pendingCtrl, d1, ch);
    pendingCtrl=null;
    setLearn(false);
    return;
  }
  for(const b of S.midi){
    if(b.cc===d1 && b.ch===ch){
      const c=CTRLS[b.id];
      if(c) c.set(d2/127);
    }
  }
}
function bindMidi(id, cc, ch){
  S.midi=S.midi.filter(b=>b.id!==id);        /* one binding per control */
  S.midi.push({cc:cc, ch:ch, id:id});
  saveState(); renderMidiList();
  const c=CTRLS[id];
  midiStatus('bound CC'+cc+' CH'+(ch+1)+' → '+(c?c.label:id));
}
function renderMidiList(){
  const host=$('midilist');
  host.innerHTML='';
  $('midiCount').textContent=S.midi.length?('('+S.midi.length+')'):'';
  if(!S.midi.length){ host.appendChild(mkHint('No bindings yet.')); return; }
  S.midi.forEach((b,idx)=>{
    const row=document.createElement('div'); row.className='midrow';
    const c=CTRLS[b.id];
    row.appendChild(mkSpan('ml',(c?c.label:b.id)));
    row.appendChild(mkSpan('cc','CC'+b.cc+' / CH'+(b.ch+1)));
    const x=document.createElement('button'); x.textContent='clear'; x.title='Remove this binding';
    x.addEventListener('click',()=>{ S.midi.splice(idx,1); saveState(); renderMidiList(); });
    row.appendChild(x);
    host.appendChild(row);
  });
}

</script>
<script>
'use strict';
/* ================= UI BUILDERS ================= */
function el(tag, cls, html){
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!==undefined) e.innerHTML=html;
  return e;
}
function mkSpan(cls, txt){ const s=el('span',cls); s.textContent=txt; return s; }
function mkHint(txt){ return el('div','hint',txt); }

/* One param row: slider line + macro-assign line. Registers for MIDI learn. */
function paramRow(parent, id, short){
  const def=PARAMS[id];
  const wrap=el('div','prow');
  const line=el('div','pline');
  const lab=el('label'); lab.textContent=short||def.label; lab.title=def.label;
  line.appendChild(lab);
  const sl=document.createElement('input');
  sl.type='range'; sl.min=0; sl.max=1; sl.step=0.001;
  sl.value=(S.params[id]!==undefined)?S.params[id]:def.def;
  sl.setAttribute('data-ctrl',id); sl.title=def.label+' — click while MIDI Learn is armed to map';
  sl.addEventListener('input',()=>setParam(id,parseFloat(sl.value),sl));
  CTRLS[id]={set:v=>setParam(id,v), label:def.label};
  line.appendChild(sl);
  const vv=el('span','pval',def.fmt(sl.value)); vv.setAttribute('data-val',id);
  line.appendChild(vv);
  wrap.appendChild(line);
  const sub=el('div','psub');
  const ml=el('span','mlab','macro \u2192'); sub.appendChild(ml);
  const ms=document.createElement('select'); ms.className='msel'; ms.title='Assign a macro knob';
  ms.appendChild(new Option('none','-1'));
  for(let m=0;m<8;m++) ms.appendChild(new Option('M'+(m+1),String(m)));
  const as=S.assigns[id]||{m:-1,d:1};
  ms.value=String(as.m);
  ms.addEventListener('change',()=>{
    const cur=S.assigns[id]||{m:-1,d:1};
    cur.m=parseInt(ms.value,10);
    S.assigns[id]=cur; saveState();
  });
  sub.appendChild(ms);
  const dp=document.createElement('input');
  dp.type='range'; dp.min=0; dp.max=1; dp.step=0.01; dp.value=as.d;
  dp.className='mdep'; dp.title='Macro depth';
  dp.addEventListener('input',()=>{
    const cur=S.assigns[id]||{m:-1,d:1};
    cur.d=parseFloat(dp.value); S.assigns[id]=cur; saveState();
  });
  sub.appendChild(dp);
  wrap.appendChild(sub);
  parent.appendChild(wrap);
}

/* ---------- layer cards ---------- */
/* ================= RESOLUME-STYLE DECK =================
   4 layer strips x 8 clip slots. Clicking a clip fires its source on the
   layer THROUGH setParam('L{i}.src') so MIDI learn / macro / preset / phone
   remote integration keeps working. PARAM_HOOKS mirrors the param into
   S.layers[i].src (which the render loop reads) and refreshes highlights. */
for(let i=0;i<4;i++){
  PARAM_HOOKS['L'+i+'.src']=[((ii)=>()=>{
    const pk='L'+ii+'.src';
    const v=(S.params[pk]!==undefined)?S.params[pk]:SRC_DEF[ii];
    const ni=Math.min(5,Math.max(0,Math.round(v*5)));
    const changed=ni!==S.layers[ii].src;
    S.layers[ii].src=ni;
    syncFiredToSrc(ii); syncDeckSel();
    if(changed){ buildProps('layerProps','layer'); buildProps('clipProps','clip'); }
  })(i)];
}
function syncFiredToSrc(i){
  const src=S.layers[i].src, cur=S.fired[i];
  if(cur!==null&&cur!==undefined&&S.clips[i][cur]===src) return; /* fired clip still matches */
  const k=S.clips[i].indexOf(src);
  S.fired[i]=k>=0?k:null;
}
function syncDeckSel(){
  document.querySelectorAll('#deck .lstrip').forEach((st,i)=>{
    st.classList.toggle('sel', !!S.sel && S.sel.kind==='layer' && S.sel.i===i);
    const L=S.layers[i];
    const bB=st.querySelector('.bByp'), bS=st.querySelector('.bSolo');
    if(bB) bB.classList.toggle('onB',L.bypass);
    if(bS) bS.classList.toggle('onS',L.solo);
  });
  document.querySelectorAll('#deck .clip').forEach(c=>{
    const i=+c.dataset.i, k=+c.dataset.k;
    c.classList.toggle('fired', S.fired[i]===k);
    c.classList.toggle('selc', !!S.sel && S.sel.kind==='clip' && S.sel.i===i && S.sel.c===k);
  });
  syncColumns();
}
function selectLayer(i){
  S.selLayer=i; S.sel={kind:'layer', i};
  syncDeckSel(); buildProps('layerProps','layer'); buildProps('clipProps','clip');
  showTab('Layer'); saveState();
}
function selectClip(i,k){
  S.selLayer=i; S.sel={kind:'clip', i:i, c:k};
  syncDeckSel(); buildProps('layerProps','layer'); buildProps('clipProps','clip');
  showTab('Clip'); saveState();
}
function toggleBypass(i){
  const L=S.layers[i]; L.bypass=!L.bypass; saveState(); syncDeckSel();
}
function fireClip(i,k){
  const src=S.clips[i][k];
  if(src===null||src===undefined) return;
  S.fired[i]=k;
  S.colFired=null; syncColumns();
  setParam('L'+i+'.src', src/5);
}
function buildDeck(){
  const host=$('deck'); host.innerHTML='';
  for(let i=0;i<4;i++){
    const L=S.layers[i];
    const st=el('div','lstrip'+((S.sel&&S.sel.kind==='layer'&&S.sel.i===i)?' sel':''));
    st.style.setProperty('--lhue', Math.round(LAYER_HUES[i]*360));
    const gut=el('div','lgut');
    const r1=el('div','lrow1');
    const tab=el('button','ltab','L'+(i+1)); tab.title='Select layer (key '+(i+1)+')';
    tab.addEventListener('click',()=>selectLayer(i)); r1.appendChild(tab);
    const bX=el('button','tbtn bClr','\u2715'); bX.title='Clear layer (unload clip)';
    bX.addEventListener('click',()=>{ L.bypass=true; S.fired[i]=null; S.colFired=null; saveState(); syncDeckSel(); syncColumns(); });
    r1.appendChild(bX);
    const bB=el('button','tbtn bByp'+(L.bypass?' onB':''),'B'); bB.title='Bypass layer (key B)';
    bB.addEventListener('click',()=>toggleBypass(i));
    r1.appendChild(bB);
    const bS=el('button','tbtn bSolo'+(L.solo?' onS':''),'S'); bS.title='Solo layer';
    bS.addEventListener('click',()=>{ L.solo=!L.solo; saveState(); syncDeckSel(); });
    r1.appendChild(bS);
    gut.appendChild(r1);
    const op=document.createElement('input');
    op.type='range'; op.min=0; op.max=1; op.step=0.001; op.className='lop';
    op.value=(S.params['L'+i+'.op']!==undefined)?S.params['L'+i+'.op']:1;
    op.setAttribute('data-ctrl','L'+i+'.op');
    op.title=LAYER_NAMES[i]+' Opacity \u2014 click while MIDI Learn is armed to map';
    op.addEventListener('input',()=>setParam('L'+i+'.op',parseFloat(op.value),op));
    CTRLS['L'+i+'.op']={set:v=>setParam('L'+i+'.op',v), label:LAYER_NAMES[i]+' Opacity'};
    gut.appendChild(op);
    st.appendChild(gut);
    const grid=el('div','clipgrid');
    for(let k=0;k<8;k++){
      const src=S.clips[i][k];
      const c=el('button','clip'+(src===null?' empty':'')+((S.fired[i]===k)?' fired':'')+((S.sel&&S.sel.kind==='clip'&&S.sel.i===i&&S.sel.c===k)?' selc':''),
        src===null?'+':LAYER_SRC[src].split(' ')[0]);
      c.dataset.i=i; c.dataset.k=k;
      c.title=(src===null?'Empty slot \u2014 right-click to assign a source':'Fire '+LAYER_SRC[src]+' on '+LAYER_NAMES[i]+' \u2014 right-click to reassign');
      c.setAttribute('data-ctrl','clip'+i+'.'+k);
      CTRLS['clip'+i+'.'+k]={set:((ii,kk)=>v=>{ if(v>=0.5) fireClip(ii,kk); })(i,k), label:'Fire '+LAYER_NAMES[i]+' clip '+(k+1)};
      c.addEventListener('click',()=>{ fireClip(i,k); selectClip(i,k); });
      c.addEventListener('contextmenu',(e)=>{ e.preventDefault(); showClipMenu(e.clientX,e.clientY,i,k); });
      grid.appendChild(c);
    }
    st.appendChild(grid);
    host.appendChild(st);
  }
}
/* clip source-assign popup */
function showClipMenu(x,y,i,k){
  const m=$('clipmenu'); m.innerHTML='';
  const cur=S.clips[i][k];
  LAYER_SRC.forEach((s,si)=>{
    const b=el('button',null,(si===cur?'\u2713 ':'')+s);
    b.addEventListener('click',()=>{ S.clips[i][k]=si; hideClipMenu(); saveState(); buildDeck(); buildProps('layerProps','layer'); buildProps('clipProps','clip'); });
    m.appendChild(b);
  });
  const bc=el('button',null,'Clear slot'); bc.style.color='#ff7b7b';
  bc.addEventListener('click',()=>{
    S.clips[i][k]=null; if(S.fired[i]===k) S.fired[i]=null;
    hideClipMenu(); saveState(); buildDeck(); buildProps('layerProps','layer'); buildProps('clipProps','clip');
  });
  m.appendChild(bc);
  m.style.display='block';
  m.style.left=Math.min(x,Math.max(0,window.innerWidth-180))+'px';
  m.style.top=Math.min(y,Math.max(0,window.innerHeight-230))+'px';
}
function hideClipMenu(){ const m=$('clipmenu'); if(m) m.style.display='none'; }
/* ---------- properties panel (selection-driven) ---------- */
function buildProps(hostId, view){
  const host=$(hostId||'propsel'); if(!host) return; host.innerHTML='';
  const base=S.sel||{kind:'layer',i:0};
  const li=Math.min(3,Math.max(0,base.i||0));
  let sel;
  if(view==='layer') sel={kind:'layer', i:li};
  else if(view==='clip') sel={kind:'clip', i:li, c:(base.kind==='clip'?base.c:(S.fired[li]??0))};
  else sel=base;
  if(sel.kind==='clip'){
    const i=sel.i, k=sel.c, src=S.clips[i][k];
    const h=el('div','phead'); h.appendChild(el('span','ptitle','CLIP  '+LAYER_NAMES[i]+' \u00B7 '+(k+1)));
    host.appendChild(h);
    const wrap=el('div','psec');
    const lab=el('label','plab','Source'); wrap.appendChild(lab);
    const se=document.createElement('select'); se.className='dsel';
    se.appendChild(new Option('(empty)','-1'));
    LAYER_SRC.forEach((s,si)=>se.appendChild(new Option(s,si)));
    se.value=String(src===null?-1:src);
    se.addEventListener('change',()=>{
      const v=parseInt(se.value,10);

  const bv=el('span','pval',BLENDS[L.blend]); bl.appendChild(bs); bl.appendChild(bv);
  bs.addEventListener('change',()=>{ L.blend=parseInt(bs.value,10); bv.textContent=BLENDS[L.blend]; saveState(); });
  br.appendChild(bl); wrap.appendChild(br);
  const trow=el('div','krow');
  const bS=el('button','tbtn'+(L.solo?' onS':''),'Solo'); bS.title='Solo layer';
  bS.addEventListener('click',()=>{ L.solo=!L.solo; saveState(); syncDeckSel(); buildProps(); });
  const bB=el('button','tbtn'+(L.bypass?' onB':''),'Bypass'); bB.title='Bypass layer (key B)';
  bB.addEventListener('click',()=>{ toggleBypass(i); buildProps(); });
  trow.appendChild(bS); trow.appendChild(bB); wrap.appendChild(trow);
  const p='L'+i+'.';
  paramRow(wrap,p+'op','Opacity'); paramRow(wrap,p+'speed','Speed');
  paramRow(wrap,p+'hue','Hue');    paramRow(wrap,p+'audio','Audio');
  paramRow(wrap,p+'p1','Param 1'); paramRow(wrap,p+'p2','Param 2');
  if(S.layers[i].src===4) buildClonerUI(wrap,i);
}

<script>
'use strict';
/* ================= CLONER 3D — UI (v1.1) =================
   discreteRow: dropdown param (MIDI-learnable, macro-assignable like sliders).
   toggleRow:   checkbox param (same). Both register SYNC_FN overrides because
   setParam's default sync assumes range inputs. */
function macroSub(wrap,id){
  const sub=el('div','psub');
  const ml=el('span','mlab','macro \u2192'); sub.appendChild(ml);
  const ms=document.createElement('select'); ms.className='msel'; ms.title='Assign a macro knob';
  ms.appendChild(new Option('none','-1'));
  for(let m=0;m<8;m++) ms.appendChild(new Option('M'+(m+1),String(m)));
  const as=S.assigns[id]||{m:-1,d:1};
  ms.value=String(as.m);
  ms.addEventListener('change',()=>{
    const cur=S.assigns[id]||{m:-1,d:1};
    cur.m=parseInt(ms.value,10);
    S.assigns[id]=cur; saveState();
  });
  sub.appendChild(ms);
  const dp=document.createElement('input');
  dp.type='range'; dp.min=0; dp.max=1; dp.step=0.01; dp.value=as.d;
  dp.className='mdep'; dp.title='Macro depth';
  dp.addEventListener('input',()=>{
    const cur=S.assigns[id]||{m:-1,d:1};
    cur.d=parseFloat(dp.value); S.assigns[id]=cur; saveState();
  });
  sub.appendChild(dp);
  wrap.appendChild(sub);
}
function discVal(id){
  const p=PARAMS[id], n=p.nopts||2;
  const v=(S.params[id]!==undefined)?S.params[id]:p.def;
  return Math.min(n-1,Math.round(v*(n-1)));
}
function discreteRow(parent,id,short,options,onChange){

  line.appendChild(lab);

  se.setAttribute('data-ctrl',id); se.title=def.label+' \u2014 click while MIDI Learn is armed to map';
  options.forEach((o,oi)=>se.appendChild(new Option(o,oi)));
  se.value=String(discVal(id));
  se.addEventListener('change',()=>{
    const idx2=parseInt(se.value,10);
    setParam(id,idx2/(n-1),se);
    if(onChange) onChange(idx2);
  });
  SYNC_FN[id]=(elm,v)=>{ elm.value=String(Math.min(n-1,Math.round(v*(n-1)))); };
  CTRLS[id]={set:v=>setParam(id,clamp(v,0,1)),label:def.label};
  line.appendChild(se);
  const vv=el('span','pval',options[discVal(id)]); vv.setAttribute('data-val',id);

}

  ck.checked=((S.params[id]!==undefined)?S.params[id]:def.def)>=0.5;
  ck.addEventListener('change',()=>setParam(id,ck.checked?1:0,ck));
  SYNC_FN[id]=(elm,v)=>{ elm.checked=v>=0.5; };
  CTRLS[id]={set:v=>setParam(id,v>=0.5?1:0),label:def.label};
  ckw.appendChild(ck);

const CL_LAYOUT_IDS=['Mode','CntX','CntY','CntZ','SpX','SpY','SpZ','RCnt','Rad','Arc',

/* Pre-register every cloner param in the MIDI-learn registry for all 4 layers,
   even when that layer's cloner UI isn't built (UI only builds for layers
   with src == Cloner 3D). Bound CCs then work regardless of visible UI;
   discreteRow/toggleRow re-register the same semantics when the UI builds. */
for(let _ri=0;_ri<4;_ri++){
  const _rp='L'+_ri+'.cl';
  Object.keys(PARAMS).forEach(_pid=>{
    if(_pid.indexOf(_rp)===0 && !CTRLS[_pid]){
      const _isTgl=PARAMS[_pid].fmt===clTglFmt;
      CTRLS[_pid]={set:v=>setParam(_pid,_isTgl?(v>=0.5?1:0):clamp(v,0,1)),
                  label:PARAMS[_pid].label};

  });
}
/* Global param hooks (registered once): any setParam on a layout-affecting
   cloner param flags that layer's instance buffer for rebuild; Mode changes
   also retoggle the conditional subgroups. This covers MIDI, phone remote,
   macro, and preset-driven changes — not just direct UI interaction. */
for(let _hi=0;_hi<4;_hi++){
  const _pre='L'+_hi+'.cl';
  CL_LAYOUT_IDS.forEach(suf=>{
    const _id=_pre+suf;
    (PARAM_HOOKS[_id]=PARAM_HOOKS[_id]||[]).push(()=>{ clonerDirty[_hi]=true; });
  });
  const _mid=_pre+'Mode';
  (PARAM_HOOKS[_mid]=PARAM_HOOKS[_mid]||[]).push(()=>{ showModeSub(_hi,discVal(_mid)); });
  const _me=_pre+'Mesh';
  (PARAM_HOOKS[_me]=PARAM_HOOKS[_me]||[]).push(()=>{ showMeshSub(_hi,discVal(_me)); });
}

<script>
'use strict';
/* ================= SHADER PLUGIN ================= */
function compilePlugin(fromInit){
  const code=$('plugcode').value;
  const body=code.replace(/^\s*#version[^\n]*\n/, '');
  lastGlslErr='';
  const pr=makeProgram(VERT, FRAG_HEAD+body);
  if(!pr){
    $('plugerr').textContent='COMPILE ERROR:\n'+lastGlslErr;
    $('plugok').textContent='';
    return false;
  }
  if(PROG.plugin) gl.deleteProgram(PROG.plugin);
  PROG.plugin=pr;
  S.pluginCode=code;
  $('plugerr').textContent='';
  $('plugok').textContent='Compiled OK — select "Plugin" as a layer source to use it.';
  if(!fromInit) saveState();
  return true;
}

/* ================= PRESETS ================= */
function getPresets(){
  try{ return JSON.parse(localStorage.getItem(LS_PRESETS)||'{}'); }catch(e){ return {}; }
}
function setPresets(p){
  try{ localStorage.setItem(LS_PRESETS, JSON.stringify(p)); }catch(e){}
  refreshPresetSel();
}
function refreshPresetSel(){
  const sel=$('presetSel'), cur=sel.value;
  sel.innerHTML='';
  sel.appendChild(new Option('-- presets --',''));
  const p=getPresets();
  Object.keys(p).sort().forEach(n=>sel.appendChild(new Option(n,n)));
  if(cur && p[cur]) sel.value=cur;
}
function snapshot(){
  return JSON.parse(JSON.stringify({
    params:S.params, assigns:S.assigns, layers:S.layers,
    clips:S.clips, fired:S.fired,
    postBypass:S.postBypass, strobeOn:S.strobeOn, beatSync:S.beatSync,
    bpm:S.bpm, macros:S.macros, res:S.res, pluginCode:S.pluginCode, midi:S.midi,
    mods:S.mods
  }));
}
function applySnapshot(snap){
  const d=defaultState();
  S.params=Object.assign({}, d.params, snap.params||{});
  S.assigns=snap.assigns||{};
  S.layers=(snap.layers||d.layers).map((l,i)=>Object.assign({}, d.layers[i], l));
  S.clips=validClips(snap.clips)||defaultClips();
  S.fired=Array.isArray(snap.fired)?snap.fired.slice(0,4):[null,null,null,null];
  while(S.fired.length<4) S.fired.push(null);
  S.sel={kind:'layer', i:0};
  /* source authority: new presets carry L{i}.src params; old ones only have layers[].src */
  for(let i=0;i<4;i++){
    const pk='L'+i+'.src';
    if(snap.params && snap.params[pk]!==undefined) S.layers[i].src=Math.min(5,Math.max(0,Math.round(clamp(S.params[pk],0,1)*5)));
    else { S.layers[i].src=Math.min(5,Math.max(0,S.layers[i].src|0)); S.params[pk]=S.layers[i].src/5; }
    syncFiredToSrc(i);
  }
  S.postBypass=Object.assign({}, d.postBypass, snap.postBypass||{});
  S.strobeOn=!!snap.strobeOn; S.beatSync=!!snap.beatSync; S.bpm=snap.bpm||120;
  S.macros=(snap.macros||d.macros).map((m,i)=>({label:(m&&m.label)||('M'+(i+1)), val:clamp(+((m&&m.val)||0),0,1)}));

<script>

'use strict';
/* ================= PROJECTION MAPPING STATE =================
   Corners stored normalized (0..1) in GL pixel space (y-up), relative to
   the output canvas — resize/orientation changes preserve calibration. */
function defaultMap(){
  return { test:false, surfaces:[{
    name:'S1', enabled:true, opacity:1, flipH:false, flipV:false,
    feather:{l:0,t:0,r:0,b:0},
    corners:[[0,0],[1,0],[1,1],[0,1]], /* TL,TR,BR,BL */
    mask:{type:0, cx:0.5, cy:0.5, w:0.5, h:0.5, inv:false}
  }]};
}
/* Runtime-only map UI state (not persisted) */
const MUI = { tab:'Play', selSurf:0, selCorner:0, mapMode:'corners', out:false, outPins:false };

/* ---- homography: unit square -> 4 corners (px, y-up). DLT, h33 = 1 ---- */
function solveH(c){
  const M=[], v=[];
  const s=[[0,0],[1,0],[1,1],[0,1]];
  for(let k=0;k<4;k++){
    const u=s[k][0], w=s[k][1], x=c[k][0], y=c[k][1];
    M.push([u,w,1,0,0,0,-u*x,-w*x]); v.push(x);
    M.push([0,0,0,u,w,1,-u*y,-w*y]); v.push(y);
  }
  const n=8;
  for(let col=0;col<n;col++){
    let piv=col;
    for(let r=col+1;r<n;r++) if(Math.abs(M[r][col])>Math.abs(M[piv][col])) piv=r;
    if(Math.abs(M[piv][col])<1e-12) continue;
    const tM=M[col]; M[col]=M[piv]; M[piv]=tM;
    const tv=v[col]; v[col]=v[piv]; v[piv]=tv;
    const d=M[col][col];
    for(let j=col;j<n;j++) M[col][j]/=d; v[col]/=d;
    for(let r=0;r<n;r++){
      if(r===col) continue;
      const f=M[r][col]; if(f===0) continue;
      for(let j=col;j<n;j++) M[r][j]-=f*M[col][j];
      v[r]-=f*v[col];
    }
  }
  return [v[0],v[1],v[2], v[3],v[4],v[5], v[6],v[7],1]; /* row-major */
}
function inv3(m){
  const a=m[0],b=m[1],c=m[2],d=m[3],e=m[4],f=m[5],g=m[6],h=m[7],i=m[8];
  const A=e*i-f*h, B=f*g-d*i, C=d*h-e*g;
  const det=a*A+b*B+c*C, id=1/((det===0)?1e-12:det);
  return [A*id,(c*h-b*i)*id,(b*f-c*e)*id,
          B*id,(a*i-c*g)*id,(c*d-a*f)*id,
          C*id,(b*g-a*h)*id,(a*e-b*d)*id];
}
function xPt(H,x,y){
  const w=H[6]*x+H[7]*y+H[8];
  return [(H[0]*x+H[1]*y+H[2])/w, (H[3]*x+H[4]*y+H[5])/w];
}
/* surface corners (normalized) -> px corners (y-up) */
function surfPx(sf,W,H){ return sf.corners.map(p=>[p[0]*W, p[1]*H]); }

/* ================= WARP SHADER ================= */
const SRC_MAP = `#version 300 es
precision highp float;
uniform sampler2D u_tex;
uniform mat3 u_invH;      /* screen px -> quad unit */
uniform float u_opacity;
uniform vec2  u_flip;     /* 0/1 per axis */
uniform vec4  u_feather;  /* L,T,R,B soft-edge widths, quad units (0=off) */
uniform int   u_maskType; /* 0 none, 1 rect, 2 ellipse */
uniform vec4  u_mask;     /* cx,cy,w,h in quad units */
uniform float u_maskInv;
uniform int   u_test;
out vec4 O;
void main(){
  vec2 fc = gl_FragCoord.xy;
  vec3 qh = u_invH * vec3(fc, 1.0);
  vec2 q = qh.xy / max(qh.z, 1e-6);
  if(q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0) discard;
  vec2 uv = mix(q, vec2(1.0) - q, u_flip);
  vec4 col;
  if(u_test == 1){
    /* alignment test pattern: grid + rings + crosshair */
    vec3 bg = vec3(0.03, 0.05, 0.12);
    vec2 gp = q * 12.0;
    vec2 gf = abs(fract(gp) - 0.5);            /* 0.5 at cell border, 0 at center */
    float fw = fwidth(gp.x) + 1e-4;
    float db = 0.5 - min(gf.x, gf.y);          /* 0 at border */
    float grid = 1.0 - smoothstep(0.0, fw * 2.0, db);
    float r = length(q - 0.5);
    float dr = abs(fract(r * 5.0) - 0.5);      /* 0.5 exactly on ring lines */
    float rings = smoothstep(0.44, 0.5, dr);
    float cross = (1.0 - smoothstep(0.0, 0.004, abs(q.x - 0.5))) +
                  (1.0 - smoothstep(0.0, 0.004, abs(q.y - 0.5)));
    vec3 tc = bg + vec3(0.25, 0.4, 0.9) * clamp(grid + rings, 0.0, 1.0)
                 + vec3(0.9, 0.3, 0.3) * clamp(cross, 0.0, 1.0);
    /* corner emphasis */
    float cd = min(min(q.x, 1.0 - q.x), min(q.y, 1.0 - q.y));
    tc += vec3(0.9, 0.9, 0.2) * (1.0 - smoothstep(0.0, 0.03, cd));
    col = vec4(tc, 1.0);
  } else {
    col = texture(u_tex, uv);
  }
  /* soft-edge feather per edge */
  float e = 1.0;
  if(u_feather.x > 0.0) e = min(e, clamp(q.x / u_feather.x, 0.0, 1.0));
  if(u_feather.y > 0.0) e = min(e, clamp(q.y / u_feather.y, 0.0, 1.0));
  if(u_feather.z > 0.0) e = min(e, clamp((1.0 - q.x) / u_feather.z, 0.0, 1.0));
  if(u_feather.w > 0.0) e = min(e, clamp((1.0 - q.y) / u_feather.w, 0.0, 1.0));
  e = smoothstep(0.0, 1.0, e);
  /* alpha mask */
  float m = 1.0;
  if(u_maskType == 1){
    vec2 d = abs(q - u_mask.xy) - u_mask.zw * 0.5;
    m = 1.0 - smoothstep(0.0, 0.015, max(d.x, d.y));
  } else if(u_maskType == 2){
    vec2 d = (q - u_mask.xy) / max(u_mask.zw * 0.5, vec2(1e-4));
    m = 1.0 - smoothstep(0.97, 1.0, length(d));
  }
  m = mix(m, 1.0 - m, u_maskInv);
  O = vec4(col.rgb, col.a * u_opacity * e * m);
}`;
let mapSrcT = null;
function compileMapProg(){
  const pr = makeProgram(VERT, SRC_MAP);
  if(!pr){ showErr('Mapping shader failed: ' + lastGlslErr); return false; }

}
function buildMapTarget(){
  if(mapSrcT){ gl.deleteTexture(mapSrcT.tex); gl.deleteFramebuffer(mapSrcT.fb); }

/* grade -> texture (mirror of renderGrade, but offscreen and without the
   one-frame uniform lag: uniforms are set BEFORE the draw here) */
function renderGradeTex(t){
  const P=PROG.grade;
  gl.bindFramebuffer(gl.FRAMEBUFFER,mapSrcT.fb);
  gl.viewport(0,0,RW,RH);
  gl.useProgram(P);
  setTex(P,'u_tex',0,postT[2].tex);
  gl.uniform1f(U(P,'u_bri'),PARAMS['P.bri'].map(eff('P.bri')));
  gl.uniform1f(U(P,'u_con'),PARAMS['P.con'].map(eff('P.con')));
  gl.uniform1f(U(P,'u_sat2'),PARAMS['P.sat'].map(eff('P.sat')));
  gl.uniform1f(U(P,'u_time'),t);
  gl.uniform1f(U(P,'u_master'),PARAMS['P.master'].map(eff('P.master'))*(S.blackout?0:1));
  quadDraw();
  gl.uniform1f(U(P,'u_strobeOn'),S.strobeOn?1:0);
  gl.uniform1f(U(P,'u_strobeRate'),PARAMS['P.srate'].map(eff('P.srate')));
  gl.uniform1f(U(P,'u_strobeAmt'),PARAMS['P.samt'].map(eff('P.samt')));
}
function renderMap(){
  const W = canvas.width, H = canvas.height;
  const P = PROG.map;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, W, H);
  gl.disable(gl.DEPTH_TEST);
  gl.clearColor(0, 0, 0, 1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(P);
  setTex(P, 'u_tex', 0, mapSrcT.tex);
  gl.uniform1i(U(P, 'u_test'), S.map.test ? 1 : 0);
  for(const sf of S.map.surfaces){
    if(!sf.enabled) continue;
    const c = surfPx(sf, W, H);
    const iH = inv3(solveH(c));
    /* column-major upload of the row-major inverse */
    gl.uniformMatrix3fv(U(P, 'u_invH'), false, new Float32Array(
      [iH[0],iH[3],iH[6], iH[1],iH[4],iH[7], iH[2],iH[5],iH[8]]));
    gl.uniform1f(U(P, 'u_opacity'), sf.opacity);
    gl.uniform2f(U(P, 'u_flip'), sf.flipH ? 1 : 0, sf.flipV ? 1 : 0);
    const eL = Math.hypot(c[3][0]-c[0][0], c[3][1]-c[0][1]) || 1;
    const eT = Math.hypot(c[1][0]-c[0][0], c[1][1]-c[0][1]) || 1;
    const eR = Math.hypot(c[2][0]-c[1][0], c[2][1]-c[1][1]) || 1;
    const eB = Math.hypot(c[3][0]-c[2][0], c[3][1]-c[2][1]) || 1;
    gl.uniform4f(U(P, 'u_feather'),
      sf.feather.l / eL, sf.feather.t / eT, sf.feather.r / eR, sf.feather.b / eB);
    gl.uniform1i(U(P, 'u_maskType'), sf.mask.type);
    gl.uniform4f(U(P, 'u_mask'), sf.mask.cx, sf.mask.cy, sf.mask.w, sf.mask.h);
    gl.uniform1f(U(P, 'u_maskInv'), sf.mask.inv ? 1 : 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.disableVertexAttribArray(0);
  }

}

/* ================= MAP OVERLAY (2D) ================= */
const mapcv = document.getElementById('mapcv');
const mctx = mapcv.getContext('2d');
const CNAMES = ['A','B','C','D'];
function fitMapCv(){
  const r = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  mapcv.width = Math.round(r.width * dpr);
  mapcv.height = Math.round(r.height * dpr);
}
/* GL-normalized (y-up) -> overlay canvas px (y-down) */
function ovPt(x, y){
  const r = canvas.getBoundingClientRect();
  return [x * r.width, (1 - y) * r.height];
}
function drawMapOverlay(){
  if(MUI.tab !== 'Map' && !MUI.out) return;
  fitMapCv();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = canvas.getBoundingClientRect();
  mctx.clearRect(0, 0, r.width, r.height);
  const showPinsOut = MUI.out && MUI.outPins;
  if(MUI.tab !== 'Map' && !showPinsOut) return; /* output mode: no overlay chrome unless pins editing */
  const sfs = S.map.surfaces;
  sfs.forEach((sf, si) => {
    if(!sf.enabled) return;
    const Hm = solveH(surfPx(sf, 1, 1)); /* normalized space */
    const qp = (x, y) => { const p = xPt(Hm, x, y); return ovPt(p[0], p[1]); };
    /* surface outline */
    const corners = [[0,0],[1,0],[1,1],[0,1]].map(q => qp(q[0], q[1]));
    mctx.beginPath();
    corners.forEach((p, k) => k ? mctx.lineTo(p[0], p[1]) : mctx.moveTo(p[0], p[1]));
    mctx.closePath();
    const sel = si === MUI.selSurf;
    mctx.strokeStyle = sel ? '#5eead4' : 'rgba(167,139,250,.45)';
    mctx.lineWidth = sel ? 3 : 1.5;
    mctx.stroke();
    /* mask shape */
    if(sf.mask.type > 0){
      const m = sf.mask;
      mctx.save();
      mctx.setLineDash([8, 6]);
      mctx.strokeStyle = '#f0abfc'; mctx.lineWidth = 2;
      if(m.type === 1){
        const c = [[m.cx-m.w/2, m.cy-m.h/2],[m.cx+m.w/2, m.cy-m.h/2],
                   [m.cx+m.w/2, m.cy+m.h/2],[m.cx-m.w/2, m.cy+m.h/2]]
                   .map(q => { const p = xPt(Hm, q[0], q[1]); return ovPt(p[0], p[1]); });
        mctx.beginPath();
        c.forEach((p, k) => k ? mctx.lineTo(p[0], p[1]) : mctx.moveTo(p[0], p[1]));
        mctx.closePath(); mctx.stroke();
      } else {
        /* ellipse: sample the warped boundary */
        mctx.beginPath();
        for(let a = 0; a <= 40; a++){
          const t = a / 40 * Math.PI * 2;
          const qx = m.cx + Math.cos(t) * m.w / 2, qy = m.cy + Math.sin(t) * m.h / 2;
          const p = xPt(Hm, qx, qy); const s = ovPt(p[0], p[1]);
          a ? mctx.lineTo(s[0], s[1]) : mctx.moveTo(s[0], s[1]);
        }
        mctx.closePath(); mctx.stroke();
      }
      mctx.restore();
    }
  });

}
function positionHandles(){
  const host = document.getElementById('handles');
  const sf = S.map.surfaces[MUI.selSurf];
  const showH = (MUI.tab === 'Map' && MUI.mapMode === 'corners') || (MUI.out && MUI.outPins);
  host.classList.toggle('on', !!(showH && sf));
  host.style.display = '';
  if(!showH || !sf){ return; }
  else{
    let hs = host.children;
    while(hs.length < 4){
      const d = document.createElement('div');
      d.className = 'chandle';
      d.textContent = CNAMES[host.children.length];
      host.appendChild(d);
    }
    for(let k = 0; k < 4; k++){
      const d = host.children[k];
      const p = ovPt(sf.corners[k][0], sf.corners[k][1]);
      d.style.left = p[0] + 'px';
      d.style.top = p[1] + 'px';
      d.classList.toggle('sel', k === MUI.selCorner);
      d.dataset.k = k;
    }
  }
  /* mask resize handle */
  const mh = document.getElementById('mhandle');
  if(MUI.tab === 'Map' && sf && MUI.mapMode === 'mask' && sf.mask.type > 0){
    const Hm = solveH(surfPx(sf, 1, 1));
    const p = xPt(Hm, sf.mask.cx + sf.mask.w / 2, sf.mask.cy + sf.mask.h / 2);

function positionOverlays(){ drawMapOverlay(); }

<script>
'use strict';
/* ================= CAMERA SOURCE (engine) =================
   getUserMedia -> hidden <video> -> per-frame texture upload, shared across
   layers. Rear camera preferred; front/rear toggle in S.camFace. Permission
   is requested the first time a Camera clip fires or is previewed; denial
   shows a toast and renders a "NO CAMERA" slate (never black).
   Requires HTTPS or localhost — file:// cannot use getUserMedia. */
let camVideo=null, camTex=null, camSlateTex=null, camStream=null;
let camState='off', camLastT=-1, camReq=null, camFaceLive=null;
for(let _ci=0;_ci<4;_ci++){
  defParam('L'+_ci+'.camFlip', LAYER_NAMES[_ci]+' Cam Flip', 0, v=>v, v=>(v>=0.5?'on':'off'));
}
async function ensureCamera(){
  const wantFace=S.camFace||'environment';
  if(camState==='live'&&camFaceLive===wantFace) return true;
  if(camState==='requesting') return camReq;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    camState='denied';
    v6Toast('Camera needs HTTPS or localhost — serve this page securely (GitHub Pages is fine).');
    return null;
  }
  if(camStream){ try{ camStream.getTracks().forEach(tr=>tr.stop()); }catch(e){} camStream=null; camState='off'; }
  camState='requesting';
  camReq=(async()=>{
    try{
      camStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:wantFace},audio:false});
      if(!camVideo){ camVideo=document.createElement('video'); camVideo.muted=true; camVideo.playsInline=true; camVideo.setAttribute('playsinline',''); }
      camVideo.srcObject=camStream;
      await camVideo.play();
      if(!camTex){
        camTex=gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D,camTex);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
      }
      camFaceLive=wantFace; camState='live'; camLastT=-1;
      v6Toast(wantFace==='user'?'Front camera live':'Rear camera live');
      return true;
    }catch(err){
      camState='denied';
      v6Toast('Camera access denied — allow it in the browser to use the Camera source.');
      return null;
    }
  })();
  return camReq;
}
function pumpCamera(){
  if(camState!=='live'||!camVideo||!camTex) return;
  if(camVideo.readyState<2||camVideo.currentTime===camLastT) return;
  camLastT=camVideo.currentTime;
  gl.bindTexture(gl.TEXTURE_2D,camTex);
  try{ gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,camVideo); }
  catch(e){ /* transient upload failure — keep last good frame */ }
}
function camSlate(){
  if(camSlateTex) return camSlateTex;
  const c=document.createElement('canvas'); c.width=480; c.height=270;
  const g=c.getContext('2d');
  g.fillStyle='#14161c'; g.fillRect(0,0,480,270);
  g.strokeStyle='#2dd4bf'; g.lineWidth=3; g.strokeRect(12,12,456,246);
  g.fillStyle='#e8eaee'; g.font='bold 34px sans-serif'; g.textAlign='center';
  g.fillText('NO CAMERA',240,120);
  g.fillStyle='#878b94'; g.font='15px sans-serif';
  g.fillText(camState==='denied'?'camera access denied — allow it in the browser':'tap a Camera clip to enable',240,152);
  const t=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);

function renderCamera(i,t,T){

    const P=PROG.cam;
    if(!P) return;
    gl.useProgram(P); setTex(P,'u_tex',0,camTex);

    const P=PROG.copy;
    if(!P) return;

/* ================= HOLOMAPPER MOBILE v6 — desktop-paradigm deck shell ========

function clipLabel(src){ return src===null?'':LAYER_SRC[src].split(' ')[0]; }
/* Chunky Resolume-style V fader — custom pointer-drag vertical fader, ported
   from desktop and adapted for touch (fatter 40x54px handle, touch-action
   pan-x so vertical drags own the gesture). Drives L{i}.op through the
   standard param plumbing (data-ctrl + CTRLS + SYNC_FN), so MIDI learn and
   macros stay in sync. The handle paints via _vfPaint(v01). */
function buildVFader(i){
  const id='L'+i+'.op';
  const root=el('div','vfad');
  root.setAttribute('data-ctrl',id);
  root.setAttribute('tabindex','0');
  root.setAttribute('role','slider');
  root.setAttribute('aria-label',LAYER_NAMES[i]+' Opacity');
  root.setAttribute('aria-valuemin','0');
  root.setAttribute('aria-valuemax','100');
  root.title=LAYER_NAMES[i]+' Opacity — drag, or tap while MIDI Learn is armed to map';
  root.appendChild(el('div','vfad-track'));
  const fill=el('div','vfad-fill'); root.appendChild(fill);
  const han=el('div','vfad-handle'); root.appendChild(han);
  const cur=()=> (S.params[id]!==undefined)?S.params[id]:1;
  const paint=(v)=>{
    const p=clamp(v,0,1)*100;
    fill.style.height='calc('+p+'% - 2px)';
    han.style.bottom=p+'%';
    root.setAttribute('aria-valuenow',String(Math.round(p)));
    const fv=root.parentElement&&root.parentElement.querySelector('.fval');
    if(fv) fv.textContent=Math.round(p)+'%';
  };
  root._vfPaint=paint;
  paint(cur());
  const setFromY=(clientY)=>{
    const r=root.getBoundingClientRect();
    if(r.height<=0) return;
    const v=clamp(1-(clientY-r.top)/r.height,0,1);
    setParam(id,v,root);
    paint(v);
  };
  root.addEventListener('pointerdown',(e)=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    /* MIDI-learn capture runs first (capture phase) and stops propagation
       when armed, so this never moves the fader during mapping. */
    try{ root.setPointerCapture(e.pointerId); }catch(err){}
    setFromY(e.clientY);
    const mv=(ev)=>setFromY(ev.clientY);
    const up=()=>{
      root.removeEventListener('pointermove',mv);
      root.removeEventListener('pointerup',up);
      root.removeEventListener('pointercancel',up);
    };
    root.addEventListener('pointermove',mv);
    root.addEventListener('pointerup',up);
    root.addEventListener('pointercancel',up);
  });
  root.addEventListener('keydown',(e)=>{
    let v=null; const c=cur();
    if(e.key==='ArrowUp'||e.key==='ArrowRight') v=c+0.05;
    else if(e.key==='ArrowDown'||e.key==='ArrowLeft') v=c-0.05;
    else if(e.key==='Home') v=1;
    else if(e.key==='End') v=0;
    else return;
    e.preventDefault(); e.stopPropagation();
    v=clamp(v,0,1); setParam(id,v,root); paint(v);
  });
  return root;
}

      box.addEventListener('click',()=>vFire(i,k));

/* ---- preview monitor: selected clip rendered small, ~10fps ---- */
let pvT=null, pvFrame=0;
const pvPx=new Uint8Array(192*108*4);
function buildPreview(){
  try{ pvT=makeTarget(192,108,0,true); }catch(e){ pvT=null; } /* 8-bit: readPixels RGBA/UNSIGNED_BYTE is illegal on RGBA16F */
}
function v6PreviewTick(){
  if(sheetOpen!=='clip'||!pvT||!pvT.ok) return;
  if((pvFrame++%6)!==0) return;
  const cv=$('pvCanvas'); if(!cv) return;
  const {i,k}=selClipInfo();
  const src=S.clips[i][k];
  if(src===null||src===undefined) return;
  renderSourceInto(src,i,performance.now()/1000,pvT);
  gl.bindFramebuffer(gl.FRAMEBUFFER,pvT.fb);
  gl.readPixels(0,0,192,108,gl.RGBA,gl.UNSIGNED_BYTE,pvPx);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const g=cv.getContext('2d');
  const img=g.createImageData(192,108);
  for(let y=0;y<108;y++){
    const so=(107-y)*192*4, do_=y*192*4;
    img.data.set(pvPx.subarray(so,so+192*4),do_);
  }
  g.putImageData(img,0,0);
}
/* per-frame v6 extras: quantized column fires, autopilot, preview */
function v6LoopExtra(beatIdx){
  if(pendingCol!==null&&(!MUI.quant||beatIdx!==lastBeatIdx)){

    S.colFired=k; syncNewUI();
  }
  v6AutoTick(beatIdx);
  v6PreviewTick();
}

/* ---- corner handle dragging ---- */
function wireHandles(){
  const host = $('handles');
  host.addEventListener('pointerdown', e => {
    const h = e.target.closest('.chandle');
    if(!h) return;
    e.preventDefault();
    MUI.selCorner = parseInt(h.dataset.k, 10);
    positionHandles();
    const r = canvas.getBoundingClientRect();
    const move = ev => {
      const x = clamp((ev.clientX - r.left) / r.width, 0, 1);
      const y = clamp(1 - (ev.clientY - r.top) / r.height, 0, 1);
      S.map.surfaces[MUI.selSurf].corners[MUI.selCorner] = [x, y];
      positionOverlays();
    };
    const up = () => {
      host.removeEventListener('pointermove', move);
      host.removeEventListener('pointerup', up);
      host.removeEventListener('pointercancel', up);
      saveState();
    };
    host.addEventListener('pointermove', move);
    host.addEventListener('pointerup', up);
    host.addEventListener('pointercancel', up);
  });
}
/* ---- mask move / resize on the overlay canvas ---- */
let maskDrag = null;
function wireMask(){
  mapcv.addEventListener('pointerdown', e => {
    if(MUI.tab !== 'Map' || MUI.mapMode !== 'mask') return;
    const sf = S.map.surfaces[MUI.selSurf];
    if(!sf || !sf.mask.type) return;
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const Hm = solveH(surfPx(sf, 1, 1));
    const toS = (qx, qy) => { const p = xPt(Hm, qx, qy); return [p[0] * r.width, (1 - p[1]) * r.height]; };
    const m = sf.mask;
    const br = toS(m.cx + m.w / 2, m.cy + m.h / 2);
    if(Math.hypot(sx - br[0], sy - br[1]) < 44){ maskDrag = { mode: 'resize' }; }
    else{
      const iH = inv3(Hm);
      const q = xPt(iH, sx / r.width, 1 - sy / r.height);
      const inside = m.type === 1
        ? Math.abs(q[0] - m.cx) < m.w / 2 && Math.abs(q[1] - m.cy) < m.h / 2
        : Math.hypot((q[0] - m.cx) / Math.max(m.w / 2, 1e-4),
                     (q[1] - m.cy) / Math.max(m.h / 2, 1e-4)) < 1;
      if(inside) maskDrag = { mode: 'move', ox: q[0] - m.cx, oy: q[1] - m.cy };
    }
    if(maskDrag){ e.preventDefault(); try{ mapcv.setPointerCapture(e.pointerId); }catch(err){} }
  });
  mapcv.addEventListener('pointermove', e => {
    if(!maskDrag) return;
    const sf = S.map.surfaces[MUI.selSurf]; if(!sf) return;
    const m = sf.mask;
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const Hm = solveH(surfPx(sf, 1, 1)), iH = inv3(Hm);
    const q = xPt(iH, sx / r.width, 1 - sy / r.height);
    if(maskDrag.mode === 'move'){
      m.cx = clamp(q[0] - maskDrag.ox, 0, 1);
      m.cy = clamp(q[1] - maskDrag.oy, 0, 1);
    }else{
      m.w = clamp(Math.abs(q[0] - m.cx) * 2, 0.02, 2);
      m.h = clamp(Math.abs(q[1] - m.cy) * 2, 0.02, 2);
    }
    positionOverlays();
  });
  const endMask = () => { if(maskDrag){ maskDrag = null; saveState(); } };
  mapcv.addEventListener('pointerup', endMask);
  mapcv.addEventListener('pointercancel', endMask);
}

  }else if(document.fullscreenElement){
    document.exitFullscreen().catch(() => {});

let tapTimes = [];

  $('btnOutput').addEventListener('click', () => setOutput(true));
  $('btnExitOut').addEventListener('click', () => setOutput(false));
  $('btnOutPins').addEventListener('click', () => {

/* ================= CANVAS FIT ================= */
function refitCanvas(){
  const r = $('stage').getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  let w = Math.round(r.width*dpr), h = Math.round(r.height*dpr);
  const m = Math.max(w,h);
  if(m > 2048){ const s=2048/m; w=Math.round(w*s); h=Math.round(h*s); }
  if(canvas.width!==w || canvas.height!==h){ canvas.width=w; canvas.height=h; }
  positionOverlays();
}

/* ================= MAIN LOOP ================= */
let tStart=performance.now()/1000, lastT=0, frames=0, fpsT=0;
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now()/1000;
  if(S.paused && lastT>0) tStart+=(now-lastT);
  const t=now-tStart; lastT=now;
  pollAudio();
  let pulse=0;
  const ph=(t*S.bpm/60)%1;
  if(S.bpm>0){ pulse=Math.pow(1-ph,3); }
  /* beat-quantized clip fires: fire on the first frame of a new beat
     (beat-index comparison — robust at any framerate) */
  const beatIdx=Math.floor(t*S.bpm/60);
  if(pendingFire){
    if(!MUI.quant || beatIdx!==lastBeatIdx){
      const p=pendingFire; pendingFire=null;
      fireClip(p.i,p.k); syncNewUI();
    }
  }
  lastBeatIdx=beatIdx;
  v6LoopExtra(beatIdx);
  beatPulse=Math.max(pulse,audioBeat);
  evalModulators(t);
  for(let i=0;i<4;i++) renderLayer(i,t);
  renderCombine();
  renderFeedback();
  renderKaleido();
  renderGlitch(t);
  renderPrism(t);
  renderGradeTex(t);
  renderMap();
  frames++;
  if(now-fpsT>0.5){
    const f=$('fps'); if(f) f.textContent=Math.round(frames/Math.max(now-fpsT,0.001))+' fps';
    frames=0; fpsT=now;
    updateMeters();
  }
}
