<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<title>HoloMapper Mobile</title>
<style>
/* ============ HoloMapper Mobile v2 shell — play-first bottom sheet ============ */
:root{
  --bg:#08090c; --panel:#10131a; --panel2:#161b24; --line:#232b38;
  --txt:#e2e8f2; --dim:#8b95a8; --acc:#8b5cf6; --acc2:#22d3ee;
  --bad:#f0524d; --ok:#34d399; --warn:#f5a623;
  --peekH:296px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
html,body{margin:0;padding:0;background:#000;color:var(--txt);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  overscroll-behavior:none;}
body{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none;}
#gl{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:0;background:#000;touch-action:none;}
[hidden]{display:none!important;}
/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(8,9,12,.88);
  border-bottom:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.brand{font-weight:800;font-size:16px;letter-spacing:.4px;white-space:nowrap;
  background:linear-gradient(90deg,var(--acc),var(--acc2));
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.brand em{font-style:normal;font-size:10px;letter-spacing:1.5px;}
#fps{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;min-width:48px;text-align:right;}
/* ---------- bottom sheet ---------- */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;flex-direction:column;
  max-height:92vh;max-height:92dvh;background:var(--panel);border-top:1px solid var(--line);
  border-radius:18px 18px 0 0;transform:translateY(calc(100% - var(--peekH)));
  transition:transform .28s cubic-bezier(.32,.72,.35,1);box-shadow:0 -8px 32px #000c;
  padding-bottom:env(safe-area-inset-bottom);}
#sheet.open{transform:translateY(0);}
#grab{touch-action:none;cursor:grab;padding:10px 0 6px;display:flex;justify-content:center;flex:none;}
#grab .pill{width:48px;height:5px;border-radius:3px;background:#3a4356;}
#sheet.open #grab .pill{background:var(--acc);}
#sheetTabs{display:flex;gap:8px;padding:2px 14px 10px;flex:none;}
#sheetTabs button{flex:1;min-height:48px;font-size:15px;font-weight:700;border-radius:12px;
  border:1px solid var(--line);background:var(--panel2);color:var(--dim);}
#sheetTabs button.on{background:var(--acc);border-color:var(--acc);color:#fff;}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain;}
@media(min-width:720px){
  #grab,#sheetTabs,#sheetBody{width:100%;max-width:860px;margin-left:auto;margin-right:auto;}
}
/* ---------- sections ---------- */
section{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 12px;}
section>h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin:0 0 10px;font-weight:700;}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0;}
.hint{font-size:12px;color:var(--dim);padding:6px 0;}
.blab{font-size:11px;color:var(--dim);}
/* ---------- gig bar ---------- */
.gigbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 12px 4px;}
.tapwrap{display:flex;flex-direction:column;gap:2px;}
.bpmdisp{display:flex;align-items:baseline;justify-content:center;gap:6px;}
#bpm{font-size:20px;font-weight:800;color:var(--acc);font-variant-numeric:tabular-nums;}
/* ---------- buttons ---------- */
button{min-height:44px;min-width:44px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--txt);font-size:14px;font-weight:600;padding:8px 12px;touch-action:manipulation;}
button:active{background:#232b3d;}
button.on{background:var(--acc);border-color:var(--acc);color:#fff;}
button.warn.on{background:var(--bad);border-color:var(--bad);}
.bigbtn{min-height:64px;border-radius:12px;font-size:16px;font-weight:800;letter-spacing:.5px;}
.bigbtn:active{transform:scale(.97);}
#btnBlackout.armed{background:var(--bad);border-color:var(--bad);color:#fff;}
#btnTap{background:#1a1430;border-color:var(--acc);color:#d9c8ff;}
/* ---------- macro knobs (remote-style dials) ---------- */
.knobgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:2px 12px 6px;}
@media(min-width:720px){.knobgrid{grid-template-columns:repeat(8,1fr);}}
.knob{--v:.5;touch-action:none;text-align:center;padding:8px 2px;border-radius:12px;min-height:44px;}
.knob:active{background:#ffffff08;}
.dial{width:76px;height:76px;border-radius:50%;margin:0 auto;position:relative;
  background:conic-gradient(from 225deg,var(--acc) 0deg calc(var(--v)*270deg),
    #232b38 calc(var(--v)*270deg) 270deg,transparent 270deg 360deg);}
.dial::after{content:'';position:absolute;inset:12px;border-radius:50%;background:#141922;}
.dial::before{content:'';position:absolute;left:50%;top:8px;width:4px;height:16px;border-radius:2px;
  background:#fff;z-index:1;transform-origin:50% 30px;
  transform:translateX(-50%) rotate(calc(-135deg + var(--v)*270deg));}
.klab{font-size:12px;font-weight:700;color:var(--acc2);margin-top:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kval{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;}
/* ---------- layer quick-select chips ---------- */
#layerchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.lchip{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:3px;min-height:66px;}
.lchip.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc);}
.lchip .ln{font-weight:800;font-size:14px;}
.lchip .ls{font-size:10px;color:var(--dim);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.lchip .lb{font-size:10px;font-weight:700;color:var(--dim);border:1px solid var(--line);
  border-radius:6px;padding:2px 10px;margin-top:2px;background:none;min-height:0;min-width:0;}
.lchip .lb.off{color:var(--bad);border-color:var(--bad);}
/* ---------- collapsible groups ---------- */
details.cgrp{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:var(--panel);}
details.cgrp>summary{min-height:52px;display:flex;align-items:center;padding:0 14px;
  font-weight:700;font-size:15px;cursor:pointer;list-style:none;}
details.cgrp>summary::-webkit-details-marker{display:none;}
details.cgrp>summary::after{content:'a';margin-left:auto;color:var(--dim);font-size:22px;
  transform:rotate(90deg);transition:transform .2s;}
details.cgrp[open]>summary::after{transform:rotate(-90deg);}
details.cgrp .csub{padding:4px 12px 12px;}
.clonerbox{border-top:1px dashed var(--line);margin-top:6px;}
/* ---------- layer cards ---------- */
#layers{display:flex;flex-direction:column;gap:10px;}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;}
.card>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:60px;padding:8px 12px;cursor:pointer;}
.card>summary::-webkit-details-marker{display:none;}
.cdot{width:14px;height:14px;border-radius:50%;flex:none;}
.cname{font-weight:800;font-size:15px;flex:none;}
.srcsel{flex:1;min-width:0;}
.cbtn{flex:none;width:48px;font-weight:800;}
.cbtn.on{background:var(--bad);border-color:var(--bad);}
.cbody{padding:6px 12px 14px;border-top:1px solid var(--line);}
/* ---------- param rows (engine builders) ---------- */
.prow{padding:8px 0;border-bottom:1px solid #1b2230;}
.prow:last-child{border-bottom:none;}
.pline{display:flex;align-items:center;gap:10px;}
.pline label{width:92px;flex:none;font-size:13px;color:var(--dim);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pval{width:58px;flex:none;text-align:right;font-size:12px;color:var(--acc2);font-variant-numeric:tabular-nums;}
.psub{display:flex;align-items:center;gap:8px;padding:4px 0 2px 102px;}
.mlab{font-size:11px;color:var(--dim);white-space:nowrap;}
.msel{min-height:38px;font-size:13px;flex:1;}
.mdep{height:38px;}
.dsel{min-height:44px;font-size:14px;}
.ckrow{display:flex;align-items:center;}
select,input[type=text],textarea{font-size:14px;color:var(--txt);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;min-height:44px;padding:8px 10px;}
textarea{width:100%;font-family:ui-monospace,monospace;font-size:12px;}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:60px;height:44px;
  background:transparent;touch-action:none;}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:#232b38;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;
  background:var(--acc);margin-top:-12px;border:none;box-shadow:0 2px 8px #0009;}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:#232b38;}
input[type=range]::-moz-range-thumb{width:32px;height:32px;border-radius:50%;background:var(--acc);border:none;}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);}
label.ck{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;}
.meters{display:flex;gap:6px;align-items:flex-end;}
.meter{width:26px;background:#232b38;border-radius:6px;position:relative;overflow:hidden;height:40px;}
.meter>i{position:absolute;bottom:0;left:0;right:0;background:var(--acc2);height:0%;}
#plugerr{color:var(--bad);font-size:12px;white-space:pre-wrap;font-family:ui-monospace,monospace;}
#plugok{color:var(--acc2);font-size:12px;}
#midilist{font-size:12px;color:var(--dim);max-height:140px;overflow-y:auto;}
/* ---------- mapping ---------- */
#mapWrap{position:fixed;inset:0;z-index:30;display:none;touch-action:none;pointer-events:none;}
#mapWrap.on{display:block;}
#mapcv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;pointer-events:none;}
#handles{position:fixed;inset:0;z-index:50;display:none;pointer-events:none;}
#handles.on{display:block;}
.chandle{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;
  background:rgba(139,92,246,.25);border:3px solid var(--acc);pointer-events:auto;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;
  color:#fff;touch-action:none;text-shadow:0 1px 3px #000;}
.chandle.sel{background:rgba(34,211,238,.35);border-color:var(--acc2);}
#mhandle{position:absolute;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:8px;
  background:rgba(34,211,238,.3);border:3px dashed var(--acc2);pointer-events:auto;touch-action:none;display:none;}
#mapUI{padding:2px 0;}
#mapUI section{margin:10px 12px;}
.surfrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1b2230;}
.surfrow .sname{flex:1;font-weight:700;font-size:15px;}
.seg{display:flex;gap:8px;margin:8px 0;}
.seg button{flex:1;}
.nudge{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;padding:8px 0;}
.nudge button{font-size:18px;}
.frow{display:flex;align-items:center;gap:8px;padding:6px 0;}
.frow label{width:110px;flex:none;font-size:13px;color:var(--dim);}
/* ---------- sheet restore fab ---------- */
#sheetFab{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;display:none;
  border-radius:999px;padding:12px 22px;font-weight:800;font-size:15px;
  background:var(--acc);border:none;color:#fff;box-shadow:0 4px 16px #000a;}
/* ---------- output mode ---------- */
#btnExitOut{position:fixed;top:calc(10px + env(safe-area-inset-top));right:10px;z-index:60;display:none;
  width:52px;height:52px;border-radius:50%;background:rgba(20,20,30,.55);color:#fff;font-size:20px;
  border:1px solid rgba(255,255,255,.25);}
#btnOutPins{position:fixed;top:calc(10px + env(safe-area-inset-top));right:72px;z-index:60;display:none;
  width:52px;height:52px;border-radius:50%;background:rgba(20,20,30,.55);color:#fff;font-size:20px;
  border:1px solid rgba(255,255,255,.25);touch-action:manipulation;}
body.output #topbar,body.output #sheet,body.output #sheetFab{display:none!important;}
body.output #handles{display:none!important;}
body.output.pins #handles{display:block!important;}
body.output #btnExitOut{display:block;}
body.output #btnOutPins{display:block;}
body.output.pins #btnOutPins{background:rgba(139,92,246,.75);border-color:var(--acc);}
body.output #mapWrap{display:block;}
#errbanner{position:fixed;top:calc(60px + env(safe-area-inset-top));left:10px;right:10px;z-index:70;display:none;
  background:#3a1d1d;border:1px solid var(--bad);color:#ffd7d7;border-radius:12px;padding:12px;font-size:13px;}
#errbanner.show{display:block;}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="errbanner"></div>

<div id="topbar">
  <span class="brand">HoloMapper <em>MOBILE</em></span>
  <span style="flex:1"></span>
  <span id="fps"></span>
  <button id="btnOutput" title="Projector output mode">&#x26F6;</button>
</div>

<div id="mapWrap">
  <canvas id="mapcv"></canvas>
  <div id="mhandle"></div>
</div>
<div id="handles"></div>

<div id="sheet">
  <div id="grab"><div class="pill"></div></div>
  <div id="sheetTabs">
    <button data-tab="Play" class="on">Play</button>
    <button data-tab="Fx">FX</button>
    <button data-tab="Map">Map</button>
  </div>
  <div id="sheetBody">
    <div id="tabPlay">
      <div class="gigbar">
        <button id="btnBlackout" class="bigbtn warn">BLACKOUT</button>
        <div class="tapwrap">
          <button id="btnTap" class="bigbtn">TAP</button>
          <div class="bpmdisp"><span id="bpm">120</span><span class="blab">BPM</span></div>
        </div>
      </div>
      <div id="macros" class="knobgrid"></div>
      <section>
        <h2>Layers</h2>
        <div id="layerchips"></div>
        <details class="cgrp" id="layerDet">
          <summary>All layers &amp; sources</summary>
          <div class="csub"><div id="layers"></div></div>
        </details>
      </section>
      <section>
        <h2>Presets</h2>
        <div class="trow">
          <select id="presetSel" style="flex:1;min-width:0"></select>
          <input type="text" id="presetName" placeholder="Name" style="width:110px">
        </div>
        <div class="trow">
          <button id="btnSavePreset" style="flex:1">Save</button>
          <button id="btnLoadPreset" style="flex:1">Load</button>
          <button id="btnDelPreset" class="warn" style="flex:1">Delete</button>
        </div>
      </section>
      <section>
        <h2>Audio &amp; engine</h2>
        <div class="trow">
          <button id="btnAudio">Enable audio</button>
          <div class="meters">
            <div class="meter"><i id="mBass"></i></div>
            <div class="meter"><i id="mMid"></i></div>
            <div class="meter"><i id="mHigh"></i></div>
          </div>
          <span id="audiostat" class="blab">audio off</span>
        </div>
        <div class="trow">
          <label class="ck"><input type="checkbox" id="ckBeatSync"> Beat sync</label>
          <label class="blab" style="margin-left:auto">Quality
            <select id="resSel">
              <option value="960x540">960x540</option>
              <option value="1280x720">1280x720</option>
              <option value="640x480">640x480</option>
            </select>
          </label>
        </div>
      </section>
      <div style="height:28px"></div>
    </div>
    <div id="tabFx" hidden>
      <section><h2>Post FX chain</h2><div id="postfx"></div></section>
      <section><h2>Master</h2><div id="masterfx"></div></section>
      <section><h2>Shader plugin</h2>
        <details class="cgrp" id="plugDet"><summary>GLSL editor</summary><div class="csub">
          <textarea id="plugcode" rows="12" spellcheck="false"></textarea>
          <div class="trow"><button id="btnCompile">Compile</button><span id="plugok"></span></div>
          <div id="plugerr"></div>
        </div></details>
      </section>
      <section><h2>MIDI</h2>
        <div class="trow"><button id="btnLearn">Arm MIDI learn</button><button id="btnLearn2">Learn</button></div>
        <div id="midistat" class="hint">MIDI not initialized</div>
        <div id="midiCount" class="hint"></div>
        <div id="midilist"></div>
      </section>
      <div style="height:28px"></div>
    </div>
    <div id="tabMap" hidden>
      <div id="mapUI"></div>
      <div style="height:28px"></div>
    </div>
  </div>
</div>

<button id="sheetFab">Panel</button>
<button id="btnExitOut" title="Exit output mode">&#x2715;</button>
<button id="btnOutPins" title="Edit corner pins in fullscreen">&#x1F4CD;</button>
<script>

'use strict';
/* =====================================================================
   HoloMapper v1 — a self-contained WebGL2 live visual performance deck.
   Zero network dependencies. One canvas, 4 layer FBOs -> combine ->
   feedback (ping-pong) -> kaleido -> glitch -> grade -> screen.
   ===================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
const lerp = (a,b,t) => a+(b-a)*t;
function debounce(fn,ms){ let t=0; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function showErr(msg){
  const b = $('errbanner');
  b.textContent = 'HoloMapper: ' + msg;
  b.classList.add('show');
  console.error('[HoloMapper]', msg);
}

</script><script>

'use strict';
/* ================= SHADER PLUGIN DEFAULT =================
   Documented for the plugin editor. The engine prepends uniform +
   helper declarations, so user code must NOT redeclare them. */
const PLUGIN_DEFAULT =
'// HoloMapper shader plugin — GLSL ES 3.00.\n' +
'// The engine declares these for you (do NOT redeclare):\n' +
'//   uniforms: u_time, u_res, u_speed, u_hue,\n' +
'//             u_audioBass, u_audioMid, u_audioHigh, u_beat,\n' +
'//             u_param1, u_param2\n' +
'//   helpers:  hsv(vec3), hash12(vec2), vnoise(vec2), fbm(vec2)\n' +
'//   output:   out vec4 O  (write your color here)\n' +
'// Entry point: void main() { ... O = vec4(color, 1.0); }\n' +
'void main(){\n' +
'  vec2 uv = (gl_FragCoord.xy - 0.5*u_res)/u_res.y;\n' +
'  float t = u_time*u_speed;\n' +
'  vec2 p = uv*3.0;\n' +
'  p += 0.9*vec2(sin(p.y*2.0 + t*1.1), cos(p.x*2.0 - t*1.4));\n' +
'  float v = sin(p.x*2.2 + t*2.0) + sin(p.y*1.8 - t*1.5) + sin((p.x+p.y)*1.6 + t*0.7);\n' +
'  v = 0.5 + 0.5*v/3.0;\n' +
'  vec3 col = hsv(vec3(fract(u_hue + v*0.5 + t*0.04), 0.85, pow(v, 1.2 + u_param1*1.5)));\n' +
'  col *= 0.8 + u_beat*0.4;\n' +
'  O = vec4(col, 1.0);\n' +
'}\n';

/* ================= PARAMETER MODEL =================
   Every learnable / macro-able parameter, stored normalized 0..1.
   map: normalized -> real uniform value.  fmt: normalized -> readout. */
const PARAMS = {};
function defParam(id, label, defN, map, fmt){
  PARAMS[id] = { id, label, def: defN,
    map: map || (v=>v),
    fmt: fmt || (v=>Math.round(v*100)+'%') };
}
const LAYER_NAMES = ['L1','L2','L3','L4'];
const LAYER_HUES  = [0.02, 0.38, 0.62, 0.15];
const LAYER_SRC   = ['Tunnel','Flow Field','Nebula','Plugin','Cloner 3D'];
const BLENDS      = ['Normal','Add','Screen','Multiply','Overlay','Difference'];
/* Cloner 3D option lists (shared by param defs and UI builders) */
const CL_MODES=['Grid','Radial','Linear'];
const CL_MESHES=['Icosahedron','Torus Knot','Box','Tetra'];
const CL_FALLS=['Infinite','Linear','Sphere','Box'];
const CL_SND=['Bass','Mid','High','Beat'];
const CL_PLANES=['XY','XZ','YZ'];
for(let i=0;i<4;i++){
  const p = 'L'+i+'.';
  defParam(p+'op',   LAYER_NAMES[i]+' Opacity', 1,   v=>v, v=>Math.round(v*100)+'%');
  defParam(p+'speed',LAYER_NAMES[i]+' Speed',   0.5, v=>v*2, v=>(v*2).toFixed(2)+'x');
  defParam(p+'hue',  LAYER_NAMES[i]+' Hue',     LAYER_HUES[i], v=>v, v=>Math.round(v*360)+'\u00B0');
  defParam(p+'audio',LAYER_NAMES[i]+' Audio',   0.6);
  defParam(p+'p1',   LAYER_NAMES[i]+' Param 1', 0.5);
  defParam(p+'p2',   LAYER_NAMES[i]+' Param 2', 0.5);
}
/* ---- Cloner 3D params (per layer). Every one flows through the standard
   param system: MIDI learn, macro assign + depth, presets, phone remote. ---- */
const clIntMap=(lo,hi)=>v=>Math.round(lo+v*(hi-lo));

  return c.z*mix(vec3(1.0),rgb,c.y);

float hash12(vec2 p){
  vec3 p3 = fract(vec3(p.xyx)*0.1031);
  p3 += dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
float vnoise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p);
  f = f*f*(3.0-2.0*f);
  float a = hash12(i);
  float b = hash12(i+vec2(1.0,0.0));
  float c = hash12(i+vec2(0.0,1.0));
  float d = hash12(i+vec2(1.0,1.0));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);

  for(int i=0;i<5;i++){ v += a*vnoise(p); p = p*2.03+vec2(19.7,7.3); a *= 0.5; }

uniform sampler2D u_l2;

  const mode=clv(i,'Mode'), positions=[];

    const sx=clv(i,'SpX'),sy=clv(i,'SpY'),sz=clv(i,'SpZ');

  paramRow(g, 'P.master', 'Master'); paramRow(g, 'P.bri', 'Bright');
  paramRow(g, 'P.con', 'Contrast'); paramRow(g, 'P.sat', 'Saturation');
  paramRow(g, 'P.vig', 'Vignette'); paramRow(g, 'P.grain', 'Grain');
  paramRow(g, 'P.aamt', 'Audio amt');
  const st = cgrp(host, 'Strobe', false);
  const tgl = el('button', (S.strobeOn ? 'warn on' : 'warn'), S.strobeOn ? 'STROBE ON' : 'Strobe off');
  tgl.style.width = '100%';
  tgl.addEventListener('click', () => { S.strobeOn = !S.strobeOn; saveState(); buildMaster(); });
  st.appendChild(tgl);
  paramRow(st, 'P.srate', 'Rate'); paramRow(st, 'P.samt', 'Amount');
}

/* ================= TABS + SHEET ================= */
function peekH(){
  const v = getComputedStyle($('sheet')).getPropertyValue('--peekH');
  return parseFloat(v) || 296;
}
function setSheetHidden(h){
  MUI.panelHidden = h;
  $('sheet').style.display = h ? 'none' : '';
  $('sheetFab').style.display = (h && MUI.tab === 'Map') ? 'block' : 'none';
  if(!h) positionOverlays();
}
function showTab(name){
  MUI.tab = name;
  setSheetHidden(false);
  document.querySelectorAll('#sheetTabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.tab === name));
  $('tabPlay').hidden = name !== 'Play';
  $('tabFx').hidden = name !== 'Fx';
  $('tabMap').hidden = name !== 'Map';
  $('mapWrap').classList.toggle('on', name === 'Map');
  $('handles').classList.toggle('on', name === 'Map');
  syncMapPointer();
  if(name === 'Map'){ buildMapUI(); positionOverlays(); }
}
function syncMapPointer(){
  $('mapcv').style.pointerEvents =
    (MUI.tab === 'Map' && MUI.mapMode === 'mask') ? 'auto' : 'none';
}
function wireSheet(){
  const sheet = $('sheet'), grab = $('grab');
  let sd = null, tapOK = true;
  grab.addEventListener('click', () => {
    if(tapOK) sheet.classList.toggle('open');
    tapOK = true;
  });
  grab.addEventListener('pointerdown', e => {
    sd = { y0: e.clientY, open: sheet.classList.contains('open') };
    tapOK = true;
    try{ grab.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  grab.addEventListener('pointermove', e => {
    if(!sd) return;
    const dy = e.clientY - sd.y0;
    if(Math.abs(dy) > 10) tapOK = false;
    else return;
    const ph = peekH(), travel = Math.max(0, sheet.scrollHeight - ph);
    const base = sd.open ? 0 : travel;
    const off = Math.max(0, Math.min(travel, base + dy));
    sheet.style.transition = 'none';
    sheet.style.transform = 'translateY(' + off + 'px)';
  });
  const end = e => {
    if(!sd) return;
    const dy = e.clientY - sd.y0, wasOpen = sd.open;
    sheet.style.transition = ''; sheet.style.transform = '';
    if(!tapOK) sheet.classList.toggle('open', wasOpen ? dy < 60 : dy < -60);
    sd = null;
  };
  grab.addEventListener('pointerup', end);
  grab.addEventListener('pointercancel', end);
  $('sheetFab').addEventListener('click', () => setSheetHidden(false));
}

/* ================= MAP UI ================= */
function sliderRow(parent, label, v01, onInput, fmt){
  const wrap = el('div', 'prow'); const line = el('div', 'pline');
  const lab = el('label'); lab.textContent = label; line.appendChild(lab);
  const sl = document.createElement('input');
  sl.type = 'range'; sl.min = 0; sl.max = 1; sl.step = 0.001; sl.value = v01;
  const vv = el('span', 'pval', fmt ? fmt(v01) : Math.round(v01 * 100) + '%');
  sl.addEventListener('input', () => {
    const v = parseFloat(sl.value);
    onInput(v);
    vv.textContent = fmt ? fmt(v) : Math.round(v * 100) + '%';
  });
  line.appendChild(sl); line.appendChild(vv);
  wrap.appendChild(line); parent.appendChild(wrap);
}
function tglRow(parent, label, val, onChange){
  const wrap = el('div', 'prow'); const line = el('div', 'pline');
  const lab = el('label'); lab.textContent = label; line.appendChild(lab);
  const ck = document.createElement('input');
  ck.type = 'checkbox'; ck.checked = !!val;
  ck.addEventListener('change', () => onChange(ck.checked));
  line.appendChild(ck); wrap.appendChild(line); parent.appendChild(wrap);
}
function buildMapUI(){
  const host = $('mapUI'); host.innerHTML = '';
  const hideB = el('button', null, '\u2304 Hide panel (reach all corners)');
  hideB.style.width = '100%'; hideB.style.marginBottom = '8px';
  hideB.addEventListener('click', () => setSheetHidden(true));
  host.appendChild(hideB);
  const ls = el('div');
  S.map.surfaces.forEach((sf, si) => {
    const row = el('div', 'surfrow');
    if(si === MUI.selSurf){ row.style.outline = '2px solid #22d3ee'; row.style.borderRadius = '10px'; }
    const nm = el('span', 'sname', (si === MUI.selSurf ? '\u25b8 ' : '') + sf.name);
    nm.addEventListener('click', () => {
      MUI.selSurf = si; MUI.selCorner = 0;
      saveState(); buildMapUI(); positionOverlays();
    });
    row.appendChild(nm);
    const en = el('button', sf.enabled ? 'on' : '', sf.enabled ? 'on' : 'off');
    en.addEventListener('click', () => {
      sf.enabled = !sf.enabled; saveState(); buildMapUI();
    });
    row.appendChild(en);
    if(S.map.surfaces.length > 1){
      const del = el('button', 'warn', '\u2715');
      del.addEventListener('click', () => {
        S.map.surfaces.splice(si, 1);
        if(MUI.selSurf >= S.map.surfaces.length) MUI.selSurf = 0;
        saveState(); buildMapUI(); positionOverlays();
      });
      row.appendChild(del);
    }
    ls.appendChild(row);
  });
  host.appendChild(ls);
  const add = el('button', null, '+ Add surface');
  add.style.width = '100%'; add.style.margin = '8px 0';
  add.addEventListener('click', () => {
    const n = S.map.surfaces.length + 1;
    S.map.surfaces.push({
      name: 'S' + n, enabled: true, opacity: 1, flipH: false, flipV: false,
      feather: { l: 0, t: 0, r: 0, b: 0 },
      corners: [[0, 0], [1, 0], [1, 1], [0, 1]],
      mask: { type: 0, cx: 0.5, cy: 0.5, w: 0.5, h: 0.5, inv: false }
    });
    MUI.selSurf = S.map.surfaces.length - 1; MUI.selCorner = 0;
    saveState(); buildMapUI(); positionOverlays();
  });
  host.appendChild(add);
  const seg = el('div', 'seg');
  const bC = el('button', MUI.mapMode === 'corners' ? 'on' : '', 'Corners');
  const bM = el('button', MUI.mapMode === 'mask' ? 'on' : '', 'Mask');
  const bT = el('button', S.map.test ? 'on' : '', 'Test pattern');
  bC.addEventListener('click', () => { MUI.mapMode = 'corners'; syncMapPointer(); buildMapUI(); positionOverlays(); });
  bM.addEventListener('click', () => { MUI.mapMode = 'mask'; syncMapPointer(); buildMapUI(); positionOverlays(); });
  bT.addEventListener('click', () => { S.map.test = !S.map.test; saveState(); buildMapUI(); });
  seg.appendChild(bC); seg.appendChild(bM); seg.appendChild(bT);
  host.appendChild(seg);
  const sec = el('section', null, '');
  const h = el('h2', null, 'Pinning'); sec.appendChild(h);
  sec.appendChild(el('div', 'hint', MUI.mapMode === 'corners'
    ? 'Drag the A B C D handles on the canvas to pin corners. Tap a handle to select it, then nudge below for precision.'
    : 'Drag inside the dashed mask to move it; drag near its corner to resize.'));
  host.appendChild(sec);
  const sf = S.map.surfaces[MUI.selSurf];
  if(sf){
    const g = cgrp(host, 'Surface ' + sf.name, true);
    sliderRow(g, 'Opacity', sf.opacity, v => { sf.opacity = v; saveState(); });
    tglRow(g, 'Flip H', sf.flipH, v => { sf.flipH = v; saveState(); });
    tglRow(g, 'Flip V', sf.flipV, v => { sf.flipV = v; saveState(); });
    const fg = cgrp(host, 'Soft-edge feather (px)', false);
    [['l', 'Left'], ['t', 'Top'], ['r', 'Right'], ['b', 'Bottom']].forEach(([k, lab]) => {
      sliderRow(fg, lab, sf.feather[k] / 200,
        v => { sf.feather[k] = Math.round(v * 200); saveState(); },
        v => Math.round(v * 200) + 'px');
    });
    const mg = cgrp(host, 'Alpha mask', false);
    const msel = document.createElement('select'); msel.className = 'dsel';
    ['None', 'Rect', 'Ellipse'].forEach((o, i) => msel.appendChild(new Option(o, i)));
    msel.value = String(sf.mask.type);
    msel.addEventListener('change', () => {
      sf.mask.type = parseInt(msel.value, 10);
      saveState(); buildMapUI(); positionOverlays();
    });
    mg.appendChild(msel);
    tglRow(mg, 'Invert mask', sf.mask.inv, v => { sf.mask.inv = v; saveState(); });
    const ng = cgrp(host, 'Nudge corner ' + CNAMES[MUI.selCorner], false);
    const pad = el('div', 'nudge');
    const stepSel = document.createElement('select'); stepSel.className = 'dsel';
    [['fine', 0.002], ['medium', 0.01], ['coarse', 0.05]].forEach(([n, v]) =>
      stepSel.appendChild(new Option(n, v)));
    const mkN = (label, dx, dy) => {
      const b = el('button', null, label);
      b.addEventListener('click', () => {
        const c = S.map.surfaces[MUI.selSurf].corners[MUI.selCorner];
        const st = parseFloat(stepSel.value);
        c[0] = clamp(c[0] + dx * st, 0, 1);
        c[1] = clamp(c[1] + dy * st, 0, 1);
        saveState(); positionOverlays();
      });
      return b;
    };
    pad.appendChild(el('span')); pad.appendChild(mkN('\u25b2', 0, 1)); pad.appendChild(el('span'));
    pad.appendChild(mkN('\u25c0', -1, 0)); pad.appendChild(mkN('\u25cf', 0, 0)); pad.appendChild(mkN('\u25b6', 1, 0));
    pad.appendChild(el('span')); pad.appendChild(mkN('\u25bc', 0, -1)); pad.appendChild(el('span'));
    ng.appendChild(pad); ng.appendChild(stepSel);
  }
}
function syncMapUI(){ positionOverlays(); }

/* ---- corner handle dragging ---- */
function wireHandles(){
  const host = $('handles');
  host.addEventListener('pointerdown', e => {
    const h = e.target.closest('.chandle');
    if(!h) return;
    e.preventDefault();
    MUI.selCorner = parseInt(h.dataset.k, 10);
    positionHandles();
    const r = canvas.getBoundingClientRect();
    const move = ev => {
      const x = clamp((ev.clientX - r.left) / r.width, 0, 1);
      const y = clamp(1 - (ev.clientY - r.top) / r.height, 0, 1);
      S.map.surfaces[MUI.selSurf].corners[MUI.selCorner] = [x, y];
      positionOverlays();
    };
    const up = () => {
      host.removeEventListener('pointermove', move);
      host.removeEventListener('pointerup', up);
      host.removeEventListener('pointercancel', up);
      saveState();
    };
    host.addEventListener('pointermove', move);
    host.addEventListener('pointerup', up);
    host.addEventListener('pointercancel', up);
  });
}
/* ---- mask move / resize on the overlay canvas ---- */
let maskDrag = null;
function wireMask(){
  mapcv.addEventListener('pointerdown', e => {
    if(MUI.tab !== 'Map' || MUI.mapMode !== 'mask') return;
    const sf = S.map.surfaces[MUI.selSurf];
    if(!sf || !sf.mask.type) return;
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const Hm = solveH(surfPx(sf, 1, 1));
    const toS = (qx, qy) => { const p = xPt(Hm, qx, qy); return [p[0] * r.width, (1 - p[1]) * r.height]; };
    const m = sf.mask;
    const br = toS(m.cx + m.w / 2, m.cy + m.h / 2);
    if(Math.hypot(sx - br[0], sy - br[1]) < 44){ maskDrag = { mode: 'resize' }; }
    else{
      const iH = inv3(Hm);
      const q = xPt(iH, sx / r.width, 1 - sy / r.height);
      const inside = m.type === 1
        ? Math.abs(q[0] - m.cx) < m.w / 2 && Math.abs(q[1] - m.cy) < m.h / 2
        : Math.hypot((q[0] - m.cx) / Math.max(m.w / 2, 1e-4),
                     (q[1] - m.cy) / Math.max(m.h / 2, 1e-4)) < 1;
      if(inside) maskDrag = { mode: 'move', ox: q[0] - m.cx, oy: q[1] - m.cy };
    }
    if(maskDrag){ e.preventDefault(); try{ mapcv.setPointerCapture(e.pointerId); }catch(err){} }
  });
  mapcv.addEventListener('pointermove', e => {
    if(!maskDrag) return;
    const sf = S.map.surfaces[MUI.selSurf]; if(!sf) return;
    const m = sf.mask;
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const Hm = solveH(surfPx(sf, 1, 1)), iH = inv3(Hm);
    const q = xPt(iH, sx / r.width, 1 - sy / r.height);
    if(maskDrag.mode === 'move'){
      m.cx = clamp(q[0] - maskDrag.ox, 0, 1);
      m.cy = clamp(q[1] - maskDrag.oy, 0, 1);
    }else{
      m.w = clamp(Math.abs(q[0] - m.cx) * 2, 0.02, 2);
      m.h = clamp(Math.abs(q[1] - m.cy) * 2, 0.02, 2);
    }
    positionOverlays();
  });
  const endMask = () => { if(maskDrag){ maskDrag = null; saveState(); } };
  mapcv.addEventListener('pointerup', endMask);
  mapcv.addEventListener('pointercancel', endMask);
}

/* ================= OUTPUT MODE ================= */
function setOutput(on){
  MUI.out = on;
  if(!on){ MUI.outPins = false; }
  document.body.classList.toggle('output', on);
  document.body.classList.toggle('pins', on && MUI.outPins);
  if(on){
    const de = document.documentElement;
    if(de.requestFullscreen) de.requestFullscreen().catch(() => {});
  }else if(document.fullscreenElement){
    document.exitFullscreen().catch(() => {});
  }
  setTimeout(() => { refitCanvas(); positionOverlays(); }, 350);
}
let tapTimes = [];
function wireOutput(){
  $('btnOutput').addEventListener('click', () => setOutput(true));
  $('btnExitOut').addEventListener('click', () => setOutput(false));
  $('btnOutPins').addEventListener('click', () => {
    MUI.outPins = !MUI.outPins;
    document.body.classList.toggle('pins', MUI.outPins);
    positionOverlays();
  });
  canvas.addEventListener('pointerdown', () => {
    if(!MUI.out) return;
    const n = performance.now();
    tapTimes.push(n); tapTimes = tapTimes.filter(t => n - t < 600);
    if(tapTimes.length >= 3){ tapTimes = []; setOutput(false); }
  });
  document.addEventListener('fullscreenchange', () => {
    if(!document.fullscreenElement && MUI.out) setOutput(false);
  });
}

/* ================= CANVAS FIT ================= */
function refitCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = Math.round(window.innerWidth * dpr), h = Math.round(window.innerHeight * dpr);
  const m = Math.max(w, h);
  if(m > 2048){ const s = 2048 / m; w = Math.round(w * s); h = Math.round(h * s); }
  if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
  positionOverlays();
}

/* ================= MAIN LOOP ================= */
let tStart = performance.now() / 1000, lastT = 0, frames = 0, fpsT = 0;
function loop(){
  requestAnimationFrame(loop);
  const now = performance.now() / 1000;
  const t = now - tStart;
  lastT = now;
  pollAudio();
  let pulse = 0;
  if(S.bpm > 0){ const ph = (t * S.bpm / 60) % 1; pulse = Math.pow(1 - ph, 3); }
  beatPulse = Math.max(pulse, audioBeat);
  for(let i = 0; i < 4; i++) renderLayer(i, t);
  renderCombine();
  renderFeedback();
  renderKaleido();
  renderGlitch(t);
  renderGradeTex(t);
  renderMap();
  frames++;
  if(now - fpsT > 0.5){
    $('fps').textContent = Math.round(frames / Math.max(now - fpsT, 0.001)) + ' fps';
    frames = 0; fpsT = now;
    updateMeters();
  }
}

/* ================= WIRING ================= */
function wireMobile(){
  document.querySelectorAll('#sheetTabs button').forEach(b =>
    b.addEventListener('click', () => showTab(b.dataset.tab)));
  wireSheet();
  /* presets */
  $('btnSavePreset').addEventListener('click', () => {
    const name = $('presetName').value.trim();
    if(!name){ showErr('Name the preset first.'); setTimeout(() => $('errbanner').classList.remove('show'), 3000); return; }
    const p = getPresets(); p[name] = snapshot(); setPresets(p);
    $('presetName').value = '';
  });
  $('btnLoadPreset').addEventListener('click', () => {
    const name = $('presetSel').value; if(!name) return;
    const p = getPresets(); if(p[name]) applySnapshot(p[name]);
  });
  $('btnDelPreset').addEventListener('click', () => {
    const name = $('presetSel').value; if(!name) return;
    const p = getPresets(); delete p[name]; setPresets(p);
  });
  $('resSel').addEventListener('change', () => {
    S.res = $('resSel').value;
    buildTargets(); buildMapTarget(); refitCanvas(); saveState();
  });
  $('btnTap').addEventListener('click', tapTempo);
  $('ckBeatSync').addEventListener('change', () => {
    S.beatSync = $('ckBeatSync').checked; saveState();
  });
  $('btnAudio').addEventListener('click', toggleAudio);
  $('btnBlackout').addEventListener('click', () => {
    S.blackout = !S.blackout;
    $('btnBlackout').classList.toggle('armed', S.blackout);
    saveState();
  });
  $('btnCompile').addEventListener('click', () => compilePlugin(false));
  $('btnLearn').addEventListener('click', () => setLearn(!learnArmed));
  $('btnLearn2').addEventListener('click', () => setLearn(!learnArmed));
  let rzT = 0;
  const onView = () => { clearTimeout(rzT); rzT = setTimeout(refitCanvas, 120); };
  window.addEventListener('resize', onView);
  window.addEventListener('orientationchange', () => setTimeout(refitCanvas, 400));
  if(window.visualViewport) window.visualViewport.addEventListener('resize', onView);
}

/* ================= INIT ================= */
function init(){
  S.blackout = false;
  try{
    if(!localStorage.getItem(LS_STATE) && !localStorage.getItem('holomapper.mobile.seen')){
      S.res = '960x540';
      localStorage.setItem('holomapper.mobile.seen', '1');
    }
  }catch(e){}
  if(!S.map || !Array.isArray(S.map.surfaces) || !S.map.surfaces.length) S.map = defaultMap();
  if(MUI.selSurf >= S.map.surfaces.length) MUI.selSurf = 0;
  $('mhandle').style.pointerEvents = 'none'; /* visual only; resize via mapcv proximity */
  buildDashboard();
  buildLayers();
  buildPostFx();
  buildMaster();
  buildPerform();
  renderMidiList();
  refreshPresetSel();
  syncTopToggles();
  $('plugcode').value = S.pluginCode;
  $('resSel').value = S.res;
  $('bpm').textContent = S.bpm;
  $('btnBlackout').classList.toggle('armed', !!S.blackout);
  wireMobile(); wireHandles(); wireMask(); wireOutput();
  buildMapUI();
  showTab('Play');
  if(!initGL()) return;
  initQuad();
  if(!compileAll()) return;
  if(!compileMapProg()) return;
  buildTargets(); buildMapTarget();
  compilePlugin(true);
  initMidi();
  refitCanvas();
  if(canvas.width < 2 || canvas.height < 2){ showErr('This viewer gives the page no screen space — open in Chrome.'); return; }
  requestAnimationFrame(loop);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
